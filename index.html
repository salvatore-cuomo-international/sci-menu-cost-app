<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メニュー原価・栄養成分 管理アプリ</title>
<style>
/* ===== 基本設定 ===== */
:root{
  --bg:#eef1f4; --panel:#ffffff; --line:#aeb7c2; --line2:#d8dee5;
  --text:#17212b; --muted:#4b5968; --accent:#14577f; --accent-d:#0d3d59;
  --input-bg:#fffbed; --input-line:#947f30;
  --calc-bg:#e8edf2; --calc-text:#273542;
  --ok:#1d7a4c; --warn:#a8660a; --warn-bg:#fdf6e6; --err:#b3261e; --err-bg:#fdeceb;
  --ok-bg:#eaf5ef;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"Yu Gothic UI","Meiryo","Hiragino Kaku Gothic ProN",sans-serif;
  background:var(--bg); color:var(--text); font-size:16px; line-height:1.65;
}
h1,h2,h3,h4{margin:0 0 10px; line-height:1.4}
h2{font-size:22px} h3{font-size:17px} h4{font-size:15px}
a{color:var(--accent)}
/* ===== ヘッダー / ナビ ===== */
#appHeader{background:#fff;border-bottom:2px solid #83909d;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(23,33,43,.12)}
.hd-top{display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.hd-title{font-size:19px;font-weight:800;letter-spacing:.01em}
.hd-title span{font-weight:400;color:var(--muted);font-size:13px;margin-left:8px}
.hd-status{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:13px}
.badge{border-radius:999px;padding:4px 11px;border:1px solid #7d8995;background:#fff;font-weight:700}
.badge.saved{background:var(--ok-bg);border-color:#b8ddc8;color:var(--ok)}
.badge.dirty{background:var(--warn-bg);border-color:#e6d3a2;color:var(--warn)}
.badge.err{background:var(--err-bg);border-color:#eebfbb;color:var(--err)}
nav#mainNav{display:flex;gap:2px;padding:0 12px;flex-wrap:wrap}
nav#mainNav button{
  background:none;border:none;border-bottom:3px solid transparent;padding:10px 16px;
  font-size:15px;font-family:inherit;color:#3b4855;cursor:pointer;font-weight:600;
}
nav#mainNav button:hover{background:#f2f4f7;color:var(--text)}
nav#mainNav button.active{color:#fff;border-bottom-color:#0a324a;font-weight:800;background:var(--accent)}
/* ===== レイアウト ===== */
main{max-width:1280px;margin:0 auto;padding:18px 18px 80px}
.panel{background:var(--panel);border:1px solid #9da8b4;border-radius:10px;padding:18px 20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(23,33,43,.08)}
.panel > h3:first-child{margin-top:0}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:700px){.g2,.g3,.g4{grid-template-columns:1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.spacer{flex:1}
/* ===== フォーム ===== */
label.f{display:block;margin-bottom:12px}
label.f > .lb{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.req{color:#fff;background:var(--err);border-radius:3px;font-size:11px;padding:1px 5px;margin-left:6px;vertical-align:2px}
.hint{font-size:12px;color:var(--muted);margin-top:3px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;font-family:inherit;font-size:15px;padding:7px 9px;
  border:2px solid var(--input-line);border-radius:6px;background:var(--input-bg);color:var(--text);
}
input:focus,select:focus,textarea:focus{outline:2px solid #7fb2d4;outline-offset:0}
input[readonly],input:disabled,select:disabled{background:var(--calc-bg)!important;border-color:var(--line)!important;color:var(--calc-text)}
textarea{min-height:60px;resize:vertical}
input[type=checkbox]{width:16px;height:16px;vertical-align:-2px}
.calcbox{background:var(--calc-bg);border:1px solid #9aa6b2;border-radius:6px;padding:8px 10px;min-height:38px;font-weight:650}
/* ===== ボタン ===== */
button.btn{
  font-family:inherit;font-size:14px;padding:8px 15px;border-radius:5px;cursor:pointer;
  border:2px solid #71808e;background:#fff;color:#16212b;font-weight:700;
}
button.btn:hover{background:#e4eaf0;border-color:#364b5c}
button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
button.btn.primary:hover{background:var(--accent-d)}
button.btn.danger{color:var(--err);border-color:#e3b6b3}
button.btn.danger:hover{background:var(--err-bg)}
button.btn.sm{font-size:13px;padding:4px 10px}
button.btn:disabled{opacity:.5;cursor:not-allowed}
.helpbtn{border:1px solid var(--line);background:#fff;border-radius:50%;width:20px;height:20px;
  font-size:12px;line-height:1;cursor:pointer;color:var(--accent);padding:0;font-family:inherit}
/* ===== テーブル ===== */
.tablewrap{overflow-x:auto}
table.dt{width:100%;border-collapse:collapse;font-size:14px}
table.dt th,table.dt td{border:1px solid #c1c9d1;padding:8px 9px;text-align:left;vertical-align:middle}
table.dt th{background:#dce3e9;color:#182530;font-weight:800;white-space:nowrap;font-size:13px;position:sticky;top:0;z-index:1}
table.dt td.num,table.dt th.num{text-align:right;white-space:nowrap}
table.dt tbody tr:nth-child(even){background:#f3f6f8}
table.dt tbody tr:hover{background:#e6f0f6}
table.dt td input,table.dt td select{padding:4px 6px;font-size:14px}
.empty{padding:26px;text-align:center;color:var(--muted);background:var(--calc-bg);border-radius:6px}
/* ===== 通知 ===== */
.msg{border-radius:5px;padding:9px 12px;margin:10px 0;font-size:14px;border:1px solid}
.msg.info{background:#eef4f9;border-color:#c3d8e8}
.msg.warn{background:var(--warn-bg);border-color:#e6d3a2;color:#6d4405}
.msg.err{background:var(--err-bg);border-color:#eebfbb;color:#8d1e18}
.msg.ok{background:var(--ok-bg);border-color:#b8ddc8;color:#125c37}
.msg ul{margin:6px 0 0 18px;padding:0}
#toast{position:fixed;right:18px;bottom:18px;z-index:200;display:flex;flex-direction:column;gap:8px}
#toast div{background:#23272e;color:#fff;padding:10px 16px;border-radius:5px;font-size:14px;box-shadow:0 3px 10px rgba(0,0,0,.25)}
#toast div.e{background:#8d1e18}
/* ===== モーダル ===== */
#modalRoot{position:fixed;inset:0;background:rgba(20,24,30,.45);display:none;z-index:150;overflow:auto;padding:30px 16px}
#modalRoot.on{display:block}
.modal{background:#fff;max-width:900px;margin:0 auto;border-radius:8px;padding:20px 22px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal.wide{max-width:1150px}
.modal h3{margin-top:0}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;border-top:1px solid var(--line2);padding-top:14px;flex-wrap:wrap}
/* ===== 統計カード ===== */
.stat{background:#fff;border:1px solid #8f9aa6;border-left:5px solid var(--accent);border-radius:8px;padding:13px 15px}
.stat .k{font-size:13px;color:var(--muted)}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.01em}
.stat .u{font-size:13px;font-weight:400;color:var(--muted);margin-left:4px}
/* ===== ステップ ===== */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.steps button{flex:1;min-width:150px;font-family:inherit;font-size:14px;padding:9px 8px;cursor:pointer;
  border:1px solid var(--line);background:#fff;border-radius:5px;color:var(--muted);text-align:left}
.steps button.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.steps button .n{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;
  background:var(--calc-bg);color:var(--text);font-size:12px;margin-right:6px}
.steps button.active .n{background:#fff;color:var(--accent)}
/* ===== 栄養成分表示 ===== */
.nutlabel{border:2px solid var(--text);padding:10px 14px;max-width:340px;background:#fff}
.nutlabel h4{border-bottom:1px solid var(--text);padding-bottom:4px;margin-bottom:6px;font-size:16px}
.nutlabel table{width:100%;border-collapse:collapse;font-size:15px}
.nutlabel td{padding:3px 0;border-bottom:1px dotted #bbb}
.nutlabel td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.nutlabel .note{font-size:12px;color:var(--muted);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);border-radius:14px;padding:2px 11px;font-size:13px;background:#fff}
.chip.on{background:#fdeceb;border-color:#eebfbb;color:#8d1e18}
.chip.unk{background:var(--warn-bg);border-color:#e6d3a2;color:#6d4405}
.tagfile{font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);background:#fff}
.pill.g{background:var(--ok-bg);border-color:#b8ddc8;color:#125c37}
.pill.y{background:var(--warn-bg);border-color:#e6d3a2;color:#6d4405}
.guide{background:#e8f2f8;border:2px solid #7da5be;border-radius:10px;padding:16px 20px;margin-bottom:16px}
.guide ol{margin:8px 0 0 20px;padding:0}
.guide li{margin-bottom:4px}
.pagelead{font-size:16px;color:#3e4d5b;margin:-3px 0 16px}
.startbox{background:#17384c;color:#fff;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 3px 12px rgba(23,33,43,.16)}
.startbox h3{font-size:20px;margin-bottom:4px}.startbox p{margin:0 0 14px;color:#e6f0f5}
.quickgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.quick{background:#fff;color:#17212b;border:2px solid #fff;border-radius:9px;padding:14px;text-align:left;cursor:pointer;font-family:inherit}
.quick:hover{border-color:#ffbd59;background:#fff8ea}.quick .n{display:block;color:#14577f;font-weight:900;font-size:12px}.quick .t{display:block;font-size:16px;font-weight:800;margin:2px 0}.quick .d{display:block;color:#536270;font-size:12px;line-height:1.45}
.sectionhead{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.sectionhead p{margin:0;color:var(--muted);font-size:13px}
.pill.zero{background:#f5e8e7;border-color:#ce8b86;color:#8a241e}
.delta.up{color:#a33a28;font-weight:800}.delta.down{color:#116b46;font-weight:800}
.costsheet{border:1px solid #8a8a8a;background:#fff}
.costsheet .sheettitle{padding:8px 10px;font-weight:900;border-bottom:1px solid #888;background:#fafafa}
.costsheet table{margin:0}
.costsheet table.dt th{background:#626262;color:#fff;border-color:#4e4e4e;position:static;text-align:center}
.costsheet table.dt td{height:42px}
.costsheet table.dt tbody tr:nth-child(even){background:#f2f2f2}
.costsheet .sheetinput{min-width:76px;background:#fffbea;border:2px solid #9b6b16}
.costsheet .totalrow{background:#e9edf0!important;font-weight:800;border-top:2px solid #333}
.resultstrip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:2px solid #4b5660;margin-top:14px;background:#fff}
.resultstrip>div{padding:12px;border-right:1px solid #aab2b9}.resultstrip>div:last-child{border-right:none}
.resultstrip .k{font-size:12px;color:#465563;font-weight:700}.resultstrip .v{font-size:24px;font-weight:900;margin-top:3px}
.profitbox{border:2px solid #52616d;border-radius:8px;padding:18px;background:#fff}
.profitbox .big{font-size:30px;font-weight:900;color:#17384c}
details.advanced{border:1px solid #aab3bb;border-radius:7px;background:#fff;margin-top:14px}
details.advanced>summary{cursor:pointer;padding:13px 15px;font-weight:800;background:#eef2f5}
details.advanced>.inside{padding:15px}
@media(max-width:900px){.quickgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:720px){.resultstrip{grid-template-columns:repeat(2,minmax(0,1fr))}.resultstrip>div:nth-child(2){border-right:none}.resultstrip>div{border-bottom:1px solid #aab2b9}}
@media(max-width:560px){body{font-size:15px}.hd-top{padding:9px 12px}.hd-status{width:100%;margin-left:0}.quickgrid{grid-template-columns:1fr}.panel{padding:15px 13px}main{padding:14px 10px 70px}nav#mainNav{flex-wrap:nowrap;overflow-x:auto;padding:0}nav#mainNav button{white-space:nowrap;padding:10px 12px}.stat .v{font-size:22px}.resultstrip{grid-template-columns:1fr}.resultstrip>div{border-right:none}}
hr.sep{border:none;border-top:1px solid var(--line2);margin:16px 0}
/* ===== 一覧と編集の2画面構成 ===== */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:1100px){.split{grid-template-columns:1fr}}
.split-r{position:sticky;top:96px;max-height:calc(100vh - 120px);overflow-y:auto}
@media(max-width:1100px){.split-r{position:static;max-height:none}}
.editorhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.editorhead .t{font-size:17px;font-weight:700}
table.dt tbody tr.sel{background:#e6eff6!important;box-shadow:inset 3px 0 0 var(--accent)}
table.dt tbody tr.clickable{cursor:pointer}
table.dt tbody tr.clickable:hover{background:#eef4f9}
.mono{font-variant-numeric:tabular-nums}
/* ===== 印刷 ===== */
@media print{
  body{background:#fff;font-size:11.5pt}
  #appHeader,#toast,.noprint,nav#mainNav,#modalRoot{display:none!important}
  main{max-width:none;padding:0}
  .panel{border:none;padding:0;margin:0 0 10mm;break-inside:avoid}
  table.dt{font-size:8.5pt;width:100%;table-layout:fixed}
  table.dt th,table.dt td{padding:3px 4px}
  table.dt th,table.dt td{word-break:break-all}
  .printarea{display:block!important}
  @page{size:A4;margin:14mm}
}
#printRoot{display:none}
/* ===== 製品規格書 ===== */
.specsheet{font-size:10.5pt;color:#000}
.specsheet .sdate{text-align:right;font-size:10pt}
.specsheet .stitle{text-align:center;font-size:20pt;font-weight:700;letter-spacing:.5em;margin:6px 0 10px}
.specsheet .shead{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px}
.specsheet .shead .l{font-size:11pt;line-height:1.7}
.specsheet .shead .r{font-size:10pt;line-height:1.7;text-align:right}
.specsheet table.sp{width:100%;border-collapse:collapse;margin:8px 0;table-layout:fixed}
.specsheet table.sp th,.specsheet table.sp td{border:1px solid #000;padding:5px 7px;font-size:10pt;vertical-align:top;word-break:break-all}
.specsheet table.sp th{background:#f0f0f0;font-weight:700;text-align:left;width:26%}
.specsheet table.sp td.ctr{text-align:center}
.specsheet .snote{font-size:9pt;margin-top:6px}
@media print{ .specsheet{font-size:10pt} }
@media print{ body.printing #appMain{display:none} body.printing #printRoot{display:block} }
</style>
</head>
<body>
<header id="appHeader">
  <div class="hd-top">
    <div class="hd-title">メニュー原価・栄養成分 管理アプリ<span id="buildTag">飲食店向け</span></div>
    <div class="hd-status">
      <span id="saveBadge" class="badge saved">保存済み</span>
      <span id="storeBadge" class="badge">保存先：確認中</span>
      <span id="ghBadge" class="badge" style="display:none">GitHub：同期オフ</span>
    </div>
  </div>
  <nav id="mainNav"></nav>
</header>
<main id="appMain"><div id="view"></div></main>
<div id="printRoot"></div>
<div id="modalRoot"></div>
<div id="toast"></div>
<script>
"use strict";
/* ============================================================
   1. 定数定義
   ============================================================ */

// 単位定義。sys=単位系（mass:重量 / vol:容量 / count:個数）、toBase=基準単位への係数
const UNITS = {
  'mg' :{sys:'mass', f:0.001, label:'mg'},
  'g'  :{sys:'mass', f:1,     label:'g'},
  'kg' :{sys:'mass', f:1000,  label:'kg'},
  'ml' :{sys:'vol',  f:1,     label:'ml'},
  'L'  :{sys:'vol',  f:1000,  label:'L'},
  '個' :{sys:'count',f:1,     label:'個'},
  '枚' :{sys:'count',f:1,     label:'枚'},
  '本' :{sys:'count',f:1,     label:'本'},
  '袋' :{sys:'count',f:1,     label:'袋'},
  '箱' :{sys:'count',f:1,     label:'箱'},
  '束' :{sys:'count',f:1,     label:'束'},
  '食' :{sys:'count',f:1,     label:'食'},
  'その他':{sys:'count',f:1,  label:'その他'}
};
const UNIT_KEYS = Object.keys(UNITS);
const SYS_BASE = {mass:'g', vol:'ml', count:'個'};
const SYS_LABEL = {mass:'重量', vol:'容量', count:'個数'};

// 特定原材料（表示義務）9品目　※2026年4月1日施行の改正でカシューナッツが追加
const ALLERGEN_MAIN = ['えび','かに','カシューナッツ','くるみ','小麦','そば','卵','乳','落花生'];
// 特定原材料に準ずるもの（表示推奨）19品目　※同改正でマカダミアナッツを追加、まつたけを削除、カシューナッツは義務へ移動
const ALLERGEN_SUB = ['アーモンド','あわび','いか','いくら','オレンジ','キウイフルーツ',
  '牛肉','ごま','さけ','さば','大豆','鶏肉','バナナ','豚肉','マカダミアナッツ','もも','やまいも','りんご','ゼラチン'];
const ALLERGEN_ALL = ALLERGEN_MAIN.concat(ALLERGEN_SUB);
const ALLERGEN_STATE = {in:'含む', out:'含まない', unknown:'未確認'};

// 栄養成分の項目定義
const NUTRIENTS = [
  {k:'kcal',    name:'エネルギー',   unit:'kcal', req:true},
  {k:'protein', name:'たんぱく質',   unit:'g',    req:true},
  {k:'fat',     name:'脂質',         unit:'g',    req:true},
  {k:'carb',    name:'炭水化物',     unit:'g',    req:true},
  {k:'sugar',   name:'糖質',         unit:'g',    req:false},
  {k:'fiber',   name:'食物繊維',     unit:'g',    req:false},
  {k:'salt',    name:'食塩相当量',   unit:'g',    req:true},
  {k:'sodium',  name:'ナトリウム',   unit:'mg',   req:false},
  {k:'satfat',  name:'飽和脂肪酸',   unit:'g',    req:false}
];
const NUTRI_BASIS = {'100g':'100g当たり','100ml':'100ml当たり','1個':'1個当たり','1食':'1食当たり'};

const ING_CATEGORIES = ['肉類','魚介類','乳製品','野菜','果物','穀類・粉','調味料','油脂','香辛料・ハーブ','冷凍食品','その他'];
const PACK_CATEGORIES = ['箱','袋','カップ','フォーク','スプーン','串','シール','ナプキン','保冷剤','その他'];
const MENU_CATEGORIES = ['ピザ','バーガー','前菜','パスタ','デザート','ドリンク','その他'];
const PREP_CATEGORIES = ['ソース','煮込み','ソテー','生地','マリネ','その他'];

const DATA_VERSION = 5;   // データ形式バージョン
const APP_BUILD = 'v5.0 Pages / 2026-09-17';   // 画面右上に表示するビルド表示
const SEED_REVISION = 11;   // 初期データの版。ここを上げると、既に使っている環境にも追加分が入る
const STORAGE_KEY = 'menuCostApp.v3';

/* ============================================================
   2. 汎用ユーティリティ
   ============================================================ */

// DOM生成ヘルパー。テキストは必ず textContent で入れるため HTML 注入は起こらない
function el(tag, props, children){
  const n = document.createElement(tag);
  if(props){
    for(const k in props){
      const v = props[k];
      if(v===null||v===undefined) continue;
      if(k==='class') n.className = v;
      else if(k==='text') n.textContent = v;
      else if(k==='html') throw new Error('html禁止');
      else if(k.slice(0,2)==='on') n.addEventListener(k.slice(2), v);
      else if(k==='style' && typeof v==='object') Object.assign(n.style,v);
      else if(k==='dataset') Object.assign(n.dataset,v);
      else if(v===true) n.setAttribute(k,'');
      else if(v!==false) n.setAttribute(k,String(v));
    }
  }
  (children||[]).forEach(c=>{
    if(c===null||c===undefined||c===false) return;
    n.appendChild(typeof c==='object' ? c : document.createTextNode(String(c)));
  });
  return n;
}
const $ = s=>document.querySelector(s);
function clear(n){ while(n.firstChild) n.removeChild(n.firstChild); return n; }

// 数値パース。空欄は null（0として扱わない）
function num(v){
  if(v===null||v===undefined) return null;
  const s = String(v).trim();
  if(s==='') return null;
  const x = Number(s.replace(/,/g,''));
  return Number.isFinite(x) ? x : null;
}
// 表示専用の丸め。内部計算には使わない
function round(v, d){
  if(v===null||v===undefined||!Number.isFinite(v)) return null;
  const m = Math.pow(10,d);
  return Math.round((v*m + (v>=0?1e-9:-1e-9)))/m;
}
// 金額は円未満を内部で保持し、表示のみ丸める（浮動小数点誤差の抑制のため加算は整数銭で行う）
// 単位原価の表示。小数第1位まで。ただし0.0になってしまう安い食材だけ、0でなくなる桁まで伸ばす
function unitCostText(v){
  if(v===null||v===undefined||!Number.isFinite(v)) return '—';
  if(v===0) return yen(0,1);
  if(Math.abs(v) >= 0.05) return yen(v,1);
  for(let d=2; d<=4; d++){ if(Math.abs(round(v,d))>0) return yen(v,d); }
  return yen(v,4);
}
function yen(v, d){
  if(v===null||!Number.isFinite(v)) return '—';
  d = (d===undefined)?0:d;
  return '¥' + round(v,d).toLocaleString('ja-JP',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function fmt(v, d){
  if(v===null||v===undefined||!Number.isFinite(v)) return '—';
  d = d||0;
  return round(v,d).toLocaleString('ja-JP',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function pct(v, d){
  if(v===null||!Number.isFinite(v)) return '—';
  return fmt(v, d===undefined?1:d) + '％';
}
// 金額加算の誤差抑制：銭単位の整数に直して合計する
function sumMoney(arr){
  let cents = 0, any=false;
  arr.forEach(v=>{ if(Number.isFinite(v)){ cents += Math.round(v*100); any=true; } });
  return any ? cents/100 : 0;
}
function todayStr(){
  const d = new Date();
  const p = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function todayJpStr(){
  const d = new Date();
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';
}
function nowStr(){
  const d = new Date();
  const p = n=>String(n).padStart(2,'0');
  return todayStr()+' '+p(d.getHours())+':'+p(d.getMinutes());
}
function uid(prefix){
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function toast(text, isError){
  const box = $('#toast');
  const d = el('div',{class:isError?'e':'', text:text});
  box.appendChild(d);
  setTimeout(()=>{ d.style.opacity='0'; d.style.transition='opacity .4s'; }, 2200);
  setTimeout(()=>{ if(d.parentNode) box.removeChild(d); }, 2700);
}
function deepCopy(o){ return JSON.parse(JSON.stringify(o)); }

/* ============================================================
   3. 保存層（IndexedDB優先。使用できない場合は localStorage）
   ============================================================ */
const Store = {
  mode:'未判定',
  db:null,
  async init(){
    // file:// で開いた場合など IndexedDB が使えない環境があるため必ず試してから判定する
    try{
      if(!window.indexedDB) throw new Error('IndexedDB非対応');
      this.db = await new Promise((res,rej)=>{
        const rq = indexedDB.open('menuCostNutritionApp', 1);
        rq.onupgradeneeded = ()=>{ const d=rq.result; if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv'); };
        rq.onsuccess = ()=>res(rq.result);
        rq.onerror = ()=>rej(rq.error||new Error('open失敗'));
        setTimeout(()=>rej(new Error('タイムアウト')), 3000);
      });
      this.mode = 'IndexedDB';
    }catch(e){
      this.db = null;
      this.mode = (function(){ try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return 'ブラウザ保存領域'; }catch(_){ return '保存不可'; } })();
    }
    return this.mode;
  },
  async load(){
    if(this.db){
      try{
        const v = await new Promise((res,rej)=>{
          const tx = this.db.transaction('kv','readonly');
          const rq = tx.objectStore('kv').get(STORAGE_KEY);
          rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error);
        });
        if(v) return v;
      }catch(e){ /* 失敗時は localStorage を見る */ }
    }
    try{
      const s = localStorage.getItem(STORAGE_KEY);
      return s ? JSON.parse(s) : null;
    }catch(e){ return null; }
  },
  async save(data){
    if(this.db){
      try{
        await new Promise((res,rej)=>{
          const tx = this.db.transaction('kv','readwrite');
          tx.objectStore('kv').put(data, STORAGE_KEY);
          tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
        });
        return true;
      }catch(e){ /* 下の localStorage にフォールバック */ }
    }
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); return true; }
    catch(e){ return false; }
  },
  async loadSync(){
    if(this.db){
      try{ return await new Promise((res,rej)=>{
        const tx=this.db.transaction('kv','readonly');
        const rq=tx.objectStore('kv').get('menuCostApp.syncBaseline');
        rq.onsuccess=()=>res(rq.result||null); rq.onerror=()=>rej(rq.error);
      }); }catch(e){}
    }
    try{ return JSON.parse(localStorage.getItem('menuCostApp.syncBaseline')||'null'); }catch(e){ return null; }
  },
  async saveSync(meta){
    if(this.db){
      try{ await new Promise((res,rej)=>{
        const tx=this.db.transaction('kv','readwrite');
        tx.objectStore('kv').put(meta,'menuCostApp.syncBaseline');
        tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error);
      }); return true; }catch(e){}
    }
    try{ localStorage.setItem('menuCostApp.syncBaseline',JSON.stringify(meta)); return true; }catch(e){ return false; }
  },
  async wipe(){
    if(this.db){ try{ await new Promise(res=>{ const tx=this.db.transaction('kv','readwrite'); tx.objectStore('kv').delete(STORAGE_KEY); tx.oncomplete=res; tx.onerror=res; }); }catch(e){} }
    try{ localStorage.removeItem(STORAGE_KEY); }catch(e){}
  }
};


/* ============================================================
   3.5 GitHub同期（複数端末で同じデータを見るための仕組み）
   ------------------------------------------------------------
   ・データ本体（JSON）をGitHubのリポジトリに置き、各端末がそれを読み書きする
   ・書き込みは必ず「取得したときの版（sha）」を添えて送るので、
     他の端末が先に更新していた場合はGitHubが受け付けず、取りこぼしが起きない
   ・その場合は3方向マージ（自分の変更／前回同期時点／相手の変更）で
     お互いの変更を残したうえで送り直す
   ・アクセストークンはこの端末のブラウザにだけ保存し、JSONバックアップには含めない
   ============================================================ */
const GH_KEY = 'menuCostApp.github';
const GH = {
  cfg: {owner:'', repo:'', branch:'main', path:'data.json', token:'', auto:true},
  sha: null,          // 最後に取得／送信したファイルの版
  base: null,         // 最後に同期できた時点のデータ（マージの基準）
  busy: false,
  queued: false,
  lastPush: '',
  lastPull: '',
  lastError: '',
  privateTarget:null,
  state: 'off'        // off / ok / busy / error / conflict
};
function ghLoadCfg(){
  try{
    const raw = localStorage.getItem(GH_KEY);
    if(raw) GH.cfg = Object.assign(GH.cfg, JSON.parse(raw));
    GH.cfg.token=sessionStorage.getItem('menuCostApp.sessionToken')||'';
  }catch(e){}
  GH.state = ghReady() ? 'ok' : 'off';
}
function ghSaveCfg(){
  try{
    const saved=Object.assign({},GH.cfg);
    delete saved.token;
    localStorage.setItem(GH_KEY, JSON.stringify(saved));
    if(GH.cfg.token) sessionStorage.setItem('menuCostApp.sessionToken',GH.cfg.token);
    else sessionStorage.removeItem('menuCostApp.sessionToken');
  }catch(e){ toast('接続設定を保存できませんでした。', true); }
}
function ghReady(){ return !!(GH.cfg.owner && GH.cfg.repo && GH.cfg.path && GH.cfg.token); }
async function ghPrivateReady(){
  try{
    const url='https://api.github.com/repos/'+encodeURIComponent(GH.cfg.owner)+'/'+encodeURIComponent(GH.cfg.repo);
    const r=await ghFetch(url);
    if(!r.ok){ ghSetState('error',ghErrText(r)); return false; }
    if(!r.json || r.json.private!==true){
      ghSetState('conflict','接続先が公開リポジトリです。原価データを送れません。非公開リポジトリを指定してください。');
      return false;
    }
    GH.privateTarget=ghTarget();
    return true;
  }catch(e){ ghSetState('error','リポジトリの公開範囲を確認できませんでした。'); return false; }
}
function ghTarget(){ return [GH.cfg.owner,GH.cfg.repo,GH.cfg.branch||'main',GH.cfg.path].join('/'); }
async function ghRemember(){
  const ok=await Store.saveSync({target:ghTarget(),sha:GH.sha,base:GH.base});
  if(!ok) ghSetState('error','同期の基準を端末に保存できません。ブラウザの空き容量を確認してください。');
  return ok;
}
function ghUrl(){
  return 'https://api.github.com/repos/'+encodeURIComponent(GH.cfg.owner)+'/'+encodeURIComponent(GH.cfg.repo)
    +'/contents/'+GH.cfg.path.split('/').map(encodeURIComponent).join('/');
}
function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  const chunk = 0x8000;
  for(let i=0;i<bytes.length;i+=chunk) bin += String.fromCharCode.apply(null, bytes.subarray(i,i+chunk));
  return btoa(bin);
}
function b64decode(b64){
  const bin = atob(String(b64).replace(/\s/g,''));
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
async function ghFetch(url, opts){
  const o = opts||{};
  const headers = Object.assign({
    'Accept':'application/vnd.github+json',
    'Authorization':'Bearer '+GH.cfg.token,
    'X-GitHub-Api-Version':'2022-11-28'
  }, o.headers||{});
  const res = await fetch(url, {method:o.method||'GET', headers:headers, body:o.body});
  let json = null;
  try{ json = await res.json(); }catch(e){}
  return {ok:res.ok, status:res.status, json:json};
}
function ghErrText(r){
  if(r.status===401) return 'アクセストークンが正しくありません。設定を確認してください。';
  if(r.status===403) return 'アクセスが拒否されました。トークンの権限（Contents の読み書き）を確認してください。';
  if(r.status===404) return 'リポジトリまたはファイルが見つかりません。所有者名・リポジトリ名・ファイル名を確認してください。';
  if(r.status===409 || r.status===422) return '他の端末が先に更新していました。';
  return '通信に失敗しました（コード '+r.status+'）。'+((r.json&&r.json.message)?r.json.message:'');
}

/* --- 3方向マージ：自分の変更と相手の変更を両方残す --- */
const GH_LISTS = ['ingredients','packages','preps','menus','priceHistory','purchaseHistory'];
function mergeData(base, mine, theirs){
  const out = deepCopy(theirs);
  GH_LISTS.forEach(k=>{
    const bm = {}, mm = {}, tm = {};
    (base&&base[k]||[]).forEach(x=>bm[x.id]=x);
    (mine&&mine[k]||[]).forEach(x=>mm[x.id]=x);
    (theirs&&theirs[k]||[]).forEach(x=>tm[x.id]=x);
    const ids = {};
    Object.keys(mm).forEach(i=>ids[i]=1); Object.keys(tm).forEach(i=>ids[i]=1);
    const result = [];
    Object.keys(ids).forEach(id=>{
      const b = bm[id], m = mm[id], t = tm[id];
      const changedByMe = JSON.stringify(m||null) !== JSON.stringify(b||null);
      if(!m){ // 自分が消した
        if(b && JSON.stringify(t||null)===JSON.stringify(b||null)) return;   // 相手が触っていなければ削除を反映
        if(t) result.push(t);                                                 // 相手が直していれば相手を残す
        return;
      }
      if(!t && b){ // 相手が消した
        if(changedByMe) result.push(m);   // 自分が直していれば残す
        return;
      }
      result.push(changedByMe ? m : (t||m));
    });
    // 並び順は相手の並びを基準にし、自分だけにあるものを後ろへ
    const order = {}; (theirs&&theirs[k]||[]).forEach((x,i)=>order[x.id]=i);
    result.sort((a,b2)=>{
      const oa = order[a.id]===undefined?9e9:order[a.id];
      const ob = order[b2.id]===undefined?9e9:order[b2.id];
      return oa-ob;
    });
    out[k] = result;
  });
  // 設定は、自分が変えていれば自分のものを使う
  if(JSON.stringify(mine.settings)!==JSON.stringify(base&&base.settings)) out.settings = deepCopy(mine.settings);
  out.seq = out.seq || {};
  ['ing','pack','prep','menu'].forEach(k=>{
    out.seq[k] = Math.max((mine.seq&&mine.seq[k])||0, (theirs.seq&&theirs.seq[k])||0);
  });
  out.seedRevision = Math.max(mine.seedRevision||0, theirs.seedRevision||0);
  return out;
}

function ghSetState(st, err){
  GH.state = st; GH.lastError = err||'';
  const b = $('#ghBadge'); if(!b) return;
  const label = {off:'同期オフ', ok:'同期済み', pending:'未送信', busy:'同期中…', error:'同期エラー', conflict:'要確認'}[st]||st;
  b.textContent = 'GitHub：'+label;
  b.className = 'badge' + (st==='ok'?' saved':(st==='error'||st==='conflict'?' err':(st==='pending'?' dirty':'')));
  b.style.display = ghReady()||st!=='off' ? '' : 'none';
}

/* --- 受信（最新を取り込む） --- */
async function ghPull(opts){
  const o = opts||{};
  if(!ghReady()){ if(!o.silent) toast('GitHubの接続設定が未入力です。', true); return false; }
  if(GH.busy){ GH.queued=true; return false; }
  if(!await ghPrivateReady()) return false;
  GH.busy=true;
  ghSetState('busy');
  try{
  const r = await ghFetch(ghUrl()+'?ref='+encodeURIComponent(GH.cfg.branch||'main'));
  if(r.status===404){
    // まだファイルが無い＝初回。今のデータをそのまま置く
    ghSetState('pending');
    if(o.createIfMissing){ GH.busy=false; return await ghPush({force:true, message:'初回アップロード'}); }
    if(!o.silent) toast('GitHub上にデータファイルがまだありません。「今のデータをGitHubに置く」を押してください。', true);
    return false;
  }
  if(!r.ok){ ghSetState('error', ghErrText(r)); if(!o.silent) toast(ghErrText(r), true); return false; }
  let remote;
  try{ remote = JSON.parse(b64decode(r.json.content)); }
  catch(e){ ghSetState('error','GitHub上のファイルを読み取れませんでした。'); if(!o.silent) toast('GitHub上のファイルを読み取れませんでした。', true); return false; }
  const sameAsBefore = (GH.sha === r.json.sha);
  GH.lastPull = nowStr();
  if(sameAsBefore && GH.base && !o.force){
    if(JSON.stringify(stripVolatile(DATA))!==JSON.stringify(stripVolatile(GH.base))) GH.queued=true;
    ghSetState(GH.queued?'pending':'ok'); return true;
  }
  if(!GH.base && !o.force && (DATA.ingredients.length||DATA.menus.length||DATA.preps.length||DATA.packages.length)
    && JSON.stringify(stripVolatile(DATA))!==JSON.stringify(stripVolatile(remote))){
    ghSetState('conflict','この端末のデータとGitHubのデータが異なります。同期基準がないため自動統合できません。JSONバックアップを取り、どちらを使うか確認してください。');
    if(!o.silent) toast(GH.lastError,true);
    return false;
  }
  const localChanged = GH.base && JSON.stringify(stripVolatile(DATA))!==JSON.stringify(stripVolatile(GH.base));
  if(localChanged && !o.force){
    // こちらにも未送信の変更がある → 両方を残す
    DATA = migrate(mergeData(GH.base, DATA, remote));
  }else{
    DATA = migrate(remote);
  }
  const merged=DATA;
  if(!await Store.save(DATA)){ ghSetState('error','取り込んだ内容を端末に保存できませんでした。'); return false; }
  GH.sha=r.json.sha;
  GH.base=deepCopy(remote); // 基準はサーバーの実際の内容。ローカルの未送信分は残す。
  if(!await ghRemember()) return false;
  if(JSON.stringify(stripVolatile(merged))!==JSON.stringify(stripVolatile(remote))) GH.queued=true;
  ghSetState(GH.queued?'pending':'ok');
  if(!o.quiet){ buildNav(); render(); }
  return true;
  }catch(e){
    ghSetState('error','GitHubからの取り込みに失敗しました。ネット接続を確認してください。');
    if(!o.silent) toast(GH.lastError,true);
    return false;
  }finally{
    GH.busy=false;
    if(GH.queued && GH.state!=='conflict'){
      GH.queued=false;
      if(GH.cfg.auto) setTimeout(()=>ghPush({silent:true}),500);
      else ghSetState('pending');
    }
  }
}

function stripVolatile(d){
  const c = deepCopy(d); delete c.savedAt; return c;
}

/* --- 送信（この端末の内容を反映する） --- */
async function ghPush(opts){
  const o = opts||{};
  if(!ghReady() || !GH.base) return false;
  if(GH.busy){ GH.queued = true; return false; }
  if(!await ghPrivateReady()) return false;
  GH.busy = true; ghSetState('busy');
  let attempt = 0, ok = false;
  try{
  while(attempt < 3 && !ok){
    attempt++;
    const sent=deepCopy(DATA);
    const body = {
      message: o.message || ('更新 '+nowStr()+'（'+(sent.settings.company&&sent.settings.company.contact||'')+'）'),
      content: b64encode(JSON.stringify(sent, null, 1)),
      branch: GH.cfg.branch || 'main'
    };
    if(GH.sha) body.sha = GH.sha;
    const r = await ghFetch(ghUrl(), {method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)});
    if(r.ok){
      GH.sha = r.json.content.sha;
      GH.base = sent;
      GH.lastPush = nowStr();
      ok = await ghRemember();
      if(ok && JSON.stringify(stripVolatile(DATA))!==JSON.stringify(stripVolatile(sent))) GH.queued=true;
      break;
    }
    if(r.status===409 || r.status===422){
      // 他の端末が先に更新していた → 取り直してマージし、もう一度送る
      const g = await ghFetch(ghUrl()+'?ref='+encodeURIComponent(GH.cfg.branch||'main'));
      if(!g.ok){ ghSetState('error', ghErrText(g)); break; }
      let remote=null;
      try{ remote = JSON.parse(b64decode(g.json.content)); }catch(e){}
      if(!remote){ ghSetState('error','GitHub上のファイルを読み取れませんでした。'); break; }
      if(!GH.base){
        ghSetState('conflict','同期の基準がありません。JSONバックアップを取り、GitHubとこの端末の内容を確認してください。');
        break;
      }
      DATA = migrate(mergeData(GH.base, DATA, remote));
      GH.sha = g.json.sha;
      if(!await Store.save(DATA)){ ghSetState('error','統合した内容を端末に保存できませんでした。'); break; }
      continue;
    }
    ghSetState('error', ghErrText(r));
    if(!o.silent) toast(ghErrText(r), true);
    break;
  }
  }catch(e){
    ghSetState('error','GitHubへの送信に失敗しました。ネット接続を確認してください。');
    if(!o.silent) toast(GH.lastError,true);
  }
  GH.busy = false;
  if(ok){
    ghSetState(GH.queued?'pending':'ok');
    if(GH.queued){
      GH.queued = false;
      if(GH.cfg.auto) setTimeout(()=>ghPush({silent:true}), 500);
    }
  }else if(GH.state==='busy'){
    ghSetState('error','送信を完了できませんでした。時間を置いて再度お試しください。');
  }
  return ok;
}

let ghPushTimer = null;
function ghAutoPush(){
  if(!GH.cfg.auto || !ghReady() || !GH.base) return;
  ghSetState('pending');
  if(ghPushTimer) clearTimeout(ghPushTimer);
  ghPushTimer = setTimeout(()=>ghPush({silent:true}), 2500);
}

let DATA = emptyData();

function setSaveState(s){

// 変更を記録し、少し待ってから自動保存する
function markDirty(){

  saveTimer = setTimeout(doSave, 600);
}
async function doSave(silent){
  DATA.savedAt = nowStr();
  const ok = await Store.save(DATA);
  setSaveState(ok?'saved':'error');
  if(ok) ghAutoPush();
  if(!ok) toast('保存できませんでした。ブラウザの保存領域がいっぱいの可能性があります。', true);
  else if(!silent) { /* 自動保存時はメッセージを出しすぎない */ }
  return ok;
}
window.addEventListener('beforeunload', function(e){
  if(saveState!=='saved'){ e.preventDefault(); e.returnValue=''; return ''; }
});

// 連番採番
function nextCode(kind, prefix){
  DATA.seq[kind] = (DATA.seq[kind]||0) + 1;
  return prefix + String(DATA.seq[kind]).padStart(4,'0');
}
// ID検索
const findIng  = id => DATA.ingredients.find(x=>x.id===id) || null;
const findPack = id => DATA.packages.find(x=>x.id===id) || null;
const findPrep = id => DATA.preps.find(x=>x.id===id) || null;
const findMenu = id => DATA.menus.find(x=>x.id===id) || null;

/* ============================================================
   5. 計算エンジン（画面描画から独立。ここだけで原価・栄養を求める）
   ============================================================ */

// 単位系を返す
function sysOf(unit){ return (UNITS[unit]||UNITS['その他']).sys; }
// 数量を単位系の基準単位（g / ml / 個）へ換算する。
// 単位系が違う場合は、1個あたり重量が登録されているときだけ換算する。
function convertQty(qty, unit, targetSys, pieceWeight){
  if(qty===null||!Number.isFinite(qty)) return {v:null, err:'使用量が未入力です'};
  const u = UNITS[unit];
  if(!u) return {v:null, err:'単位が不明です'};
  if(u.sys===targetSys) return {v: qty*u.f, err:null};
  // 個数 → 重量
  if(u.sys==='count' && targetSys==='mass'){
    if(Number.isFinite(pieceWeight)&&pieceWeight>0) return {v: qty*pieceWeight, err:null};
    return {v:null, err:'個数から重量へ換算できません。食材に「1個あたりの重量」を登録してください'};
  }
  // 重量 → 個数
  if(u.sys==='mass' && targetSys==='count'){
    if(Number.isFinite(pieceWeight)&&pieceWeight>0) return {v: (qty*u.f)/pieceWeight, err:null};
    return {v:null, err:'重量から個数へ換算できません。食材に「1個あたりの重量」を登録してください'};
  }
  // 重量と容量の相互換算は行わない（比重が未登録のため）
  return {v:null, err:'「'+SYS_LABEL[u.sys]+'」と「'+SYS_LABEL[targetSys]+'」は換算できません。単位を合わせてください'};
}

// 食材1件の単位原価を求める
// 可食部数量 ＝ 購入数量を基準単位へ換算 × 歩留まり率、単位原価 ＝ 購入価格 ÷ 可食部数量
// 原価と利益は税抜で比較する。税込入力の税率は明示させる。
function excludingTax(price, taxType, taxRate){
  if(price===null) return null;
  if(taxType!=='incl') return price;
  const rate=num(taxRate);
  return rate===8||rate===10 ? price/(1+rate/100) : null;
}
function taxRateControl(value, onChange){
  return selectEl([{v:'8',t:'8％'},{v:'10',t:'10％'}],
    value===8||value===10 ? String(value) : '',
    v=>onChange(v===''?null:Number(v)), {blank:'要確認'});
}
function calcIngredient(ing){
  const r = {sys: sysOf(ing.unit), base: SYS_BASE[sysOf(ing.unit)], edible:null, unitCost:null, purchaseUnitCost:null, yieldRate:null, errors:[]};
  const price = num(ing.price);
  const qty = num(ing.qty);
  if(price===null) r.errors.push('購入価格を入力してください');
  if(qty===null||qty===0) r.errors.push('購入数量を入力してください（0では計算できません）');
  if(qty!==null && qty<0) r.errors.push('購入数量にマイナスは入力できません');
  if(price!==null && price<0) r.errors.push('購入価格にマイナスは入力できません');
  if(ing.taxType==='incl' && price!==null && excludingTax(price,ing.taxType,ing.taxRate)===null)
    r.errors.push('税込購入価格の税率（8％または10％）を選んでください');
  let y = num(ing.yieldRate);
  if(y===null) y = 100;                    // 歩留まり率が未入力なら100％として扱う
  if(y<=0||y>100) r.errors.push('歩留まり率は1〜100の範囲で入力してください');
  if(r.errors.length) return r;
  const baseQty = qty * UNITS[ing.unit].f;
  r.yieldRate = y;
  r.purchaseUnitCost = excludingTax(price,ing.taxType,ing.taxRate) / baseQty;
  r.edible = baseQty * (y/100);
  if(r.edible<=0){ r.errors.push('可食部数量が0になります。数量と歩留まり率を確認してください'); return r; }
  r.unitCost = excludingTax(price,ing.taxType,ing.taxRate) / r.edible; // 税抜単位原価
  return r;
}

// 食材の栄養成分を「基準単位1あたり」に直す
function ingNutriPerBase(ing){
  const sys = sysOf(ing.unit);
  const pw = num(ing.pieceWeight);
  const n = ing.nutri || {};
  const basis = n.basis || '100g';
  const out = {vals:{}, missing:[], convertible:true, note:null};
  let factor = null;   // 登録値 × factor = 基準単位1あたりの値
  if(basis==='100g'){
    if(sys==='mass') factor = 1/100;
    else if(sys==='count' && pw>0) factor = pw/100;
  }else if(basis==='100ml'){
    if(sys==='vol') factor = 1/100;
    else if(sys==='count' && pw>0) factor = pw/100;   // 1個あたり容量として扱う
  }else{ // 1個当たり / 1食当たり
    if(sys==='count') factor = 1;
    else if(sys==='mass' && pw>0) factor = 1/pw;
  }
  if(factor===null){
    out.convertible = false;
    out.note = '栄養成分の基準（'+NUTRI_BASIS[basis]+'）と購入単位（'+ing.unit+'）が対応しません。1個あたりの重量を登録してください';
  }
  NUTRIENTS.forEach(x=>{
    const v = num(n[x.k]);
    if(v===null || !out.convertible){ out.vals[x.k]=null; if(x.req) out.missing.push(x.name); }
    else out.vals[x.k] = v*factor;
  });
  return out;
}

// 参照（食材 or 仕込み品）を、共通の「材料」形として解決する
// prepStack は循環参照を検出するための呼び出し履歴
function resolveRef(type, id, prepStack){
  if(type==='ing'){
    const ing = findIng(id);
    if(!ing) return {ok:false, name:'（削除された食材）', error:'この食材は登録されていません'};
    const c = calcIngredient(ing);
    const nu = ingNutriPerBase(ing);
    return {
      ok: c.errors.length===0, kind:'ing', id:id,
      name: ing.name, dispName: ing.dispName || ing.name,
      sys: c.sys, base: c.base, baseLabel: (c.sys==='count' ? ing.unit : c.base),
      unitCost: c.unitCost, purchaseUnitCost:c.purchaseUnitCost, yieldRate:c.yieldRate, pieceWeight: num(ing.pieceWeight),
      nutriPerBase: nu.vals, nutriMissing: nu.missing, nutriNote: nu.note,
      allergens: ing.allergens || {},
      error: c.errors[0] || null
    };
  }
  // 仕込み品：完成重量を基準に「1gあたり原価」として扱う
  const prep = findPrep(id);
  if(!prep) return {ok:false, name:'（削除された仕込み品）', error:'この仕込み品は登録されていません'};
  const stack = (prepStack||[]).slice();
  if(stack.indexOf(id)>=0){
    return {ok:false, kind:'prep', id:id, name:prep.name, dispName:prep.name,
            error:'循環参照です（'+prep.name+' が自分自身を含んでいます）'};
  }
  stack.push(id);
  const pc = calcPrep(prep, stack);
  return {
    ok: pc.unitCost!==null, kind:'prep', id:id,
    name: prep.name, dispName: prep.name,
    sys:'mass', base:'g', baseLabel:'g', unitCost: pc.unitCost, pieceWeight:null,
    nutriPerBase: pc.nutriPerG, nutriMissing: pc.nutriMissing, nutriNote:null,
    allergens: pc.allergens, error: pc.errors[0]||null, prepCalc: pc
  };
}

// 材料1行の計算（原価・栄養・重量）
function calcLine(item, prepStack){
  const ref = resolveRef(item.refType, item.refId, prepStack);
  const out = {ref:ref, name:ref.name, dispName:ref.dispName, qty:num(item.qty), unit:item.unit,
               baseQty:null, cost:null, grams:null, nutri:{}, errors:[], warns:[]};
  if(ref.error) out.errors.push(ref.name+'：'+ref.error);
  if(!ref.ok) return out;
  const cv = convertQty(out.qty, item.unit, ref.sys, ref.pieceWeight);
  if(cv.err){ out.errors.push(ref.name+'：'+cv.err); return out; }
  if(cv.v<0){ out.errors.push(ref.name+'：使用量にマイナスは入力できません'); return out; }
  out.baseQty = cv.v;
  if(ref.kind==='ing'){
    let y = num(item.yieldRate);
    if(y===null) y = ref.yieldRate===null ? 100 : ref.yieldRate;
    out.yieldRate = y;
    if(y<=0||y>100){ out.errors.push(ref.name+'：歩留まり率は1〜100％で入力してください'); return out; }
    out.cost = ref.purchaseUnitCost * cv.v / (y/100);
  }else{
    out.yieldRate = 100;
    out.cost = ref.unitCost * cv.v;
  }
  // 提供重量の集計用にグラム換算も試みる（できない場合は null のまま）
  if(ref.sys==='mass') out.grams = cv.v;
  else if(ref.sys==='count' && ref.pieceWeight>0) out.grams = cv.v*ref.pieceWeight;
  // mlをgへ推測換算しない。実測した仕上がり重量が必要。
  // 栄養
  NUTRIENTS.forEach(x=>{
    const per = ref.nutriPerBase ? ref.nutriPerBase[x.k] : null;
    out.nutri[x.k] = (per===null||per===undefined) ? null : per*cv.v;
  });
  if(ref.nutriMissing && ref.nutriMissing.length) out.warns.push(ref.name);
  if(ref.nutriNote) out.warns.push(ref.name+'（'+ref.nutriNote+'）');
  return out;
}

// 空の栄養合計オブジェクト
function emptyNutri(){ const o={}; NUTRIENTS.forEach(x=>o[x.k]=0); return o; }
// 栄養を加算する。1つでも未入力があればその項目は「未確定」として null にする
function addNutri(total, part, flags){
  NUTRIENTS.forEach(x=>{
    if(part[x.k]===null||part[x.k]===undefined){ flags[x.k]=true; }
    else if(total[x.k]!==null) total[x.k] += part[x.k];
  });
}
function finalizeNutri(total, flags){
  const o={};
  NUTRIENTS.forEach(x=>{ o[x.k] = flags[x.k] ? null : total[x.k]; });
  return o;
}
function scaleNutri(n, k){
  const o={};
  NUTRIENTS.forEach(x=>{ o[x.k] = (n[x.k]===null||n[x.k]===undefined||!Number.isFinite(k)) ? null : n[x.k]*k; });
  return o;
}
// アレルゲン集計：1つでも「含む」があれば含む、なければ「未確認」があれば未確認
function mergeAllergens(list){
  const out = {}; const unknownBy = {};
  ALLERGEN_ALL.forEach(a=>out[a]='out');
  list.forEach(entry=>{
    const al = entry.allergens||{};
    ALLERGEN_ALL.forEach(a=>{
      const s = al[a];
      if(s==='in') out[a]='in';
      else if((s===undefined||s==='unknown') && out[a]!=='in'){
        out[a]='unknown';
        (unknownBy[a] = unknownBy[a]||[]).push(entry.name);
      }
    });
  });
  return {map:out, unknownBy:unknownBy};
}

// 仕込み品の計算
function calcPrep(prep, prepStack){
  const res = {lines:[], totalCost:null, unitCost:null, per100gCost:null, perBatchCost:null,
               nutriTotal:null, nutriPerG:{}, nutriPer100g:null, nutriMissing:[], allergens:{},
               unknownAllergenBy:{}, errors:[], warns:[], finished:null};
  const stack = prepStack || [prep.id];
  const costs = [];
  const total = emptyNutri(); const flags = {};
  const allergenSrc = [];
  (prep.items||[]).forEach(it=>{
    const L = calcLine(it, stack);
    res.lines.push(L);
    L.errors.forEach(e=>res.errors.push(e));
    L.warns.forEach(w=>res.warns.push(w));
    if(L.cost!==null) costs.push(L.cost);
    addNutri(total, L.nutri, flags);
    if(L.ref && L.ref.allergens) allergenSrc.push({name:L.ref.name, allergens:L.ref.allergens});
  });
  const ag = mergeAllergens(allergenSrc);
  res.allergens = ag.map; res.unknownAllergenBy = ag.unknownBy;
  res.nutriTotal = finalizeNutri(total, flags);
  NUTRIENTS.forEach(x=>{ if(flags[x.k] && x.req) res.nutriMissing.push(x.name); });
  if(!res.errors.length && (prep.items||[]).length) res.totalCost = sumMoney(costs);
  const fin = num(prep.finishedWeight);
  res.finished = fin;
  if(fin===null||fin<=0){
    res.errors.push('完成重量を入力してください（1g当たり原価の計算に必要です）');
  }else if(res.totalCost!==null){
    res.unitCost = res.totalCost/fin;              // 完成品1g当たり原価
    res.per100gCost = res.unitCost*100;
    const batches = num(prep.batchCount);
    res.perBatchCost = (batches!==null && batches>0) ? res.totalCost/batches : res.totalCost;
    // 加熱減量後も投入材料の栄養合計は保持し、完成重量を基準に100g当たりへ再計算する
    res.nutriPer100g = scaleNutri(res.nutriTotal, 100/fin);
    NUTRIENTS.forEach(x=>{ res.nutriPerG[x.k] = res.nutriTotal[x.k]===null ? null : res.nutriTotal[x.k]/fin; });
  }
  if(fin===null||fin<=0){ NUTRIENTS.forEach(x=>res.nutriPerG[x.k]=null); }
  return res;
}

// 循環参照チェック：prepId の材料に candidateId を追加してよいか
function wouldCycle(prepId, candidateType, candidateId){
  if(candidateType!=='prep') return false;
  if(candidateId===prepId) return true;
  const seen = {};
  const walk = id=>{
    if(id===prepId) return true;
    if(seen[id]) return false;
    seen[id]=true;
    const p = findPrep(id);
    if(!p) return false;
    return (p.items||[]).some(it=> it.refType==='prep' && walk(it.refId));
  };
  return walk(candidateId);
}

// 材料の「購入規格」を取り出す（計算書に載せるため）
// 食材は購入数量＋単位と購入価格、仕込み品は完成重量と仕込み全体の原価を返す
function refSpec(kind, id){
  if(kind==='ing'){
    const i = findIng(id);
    if(!i) return {qty:null, unit:'', price:null, supplier:'', maker:'', product:''};
    return {qty:num(i.qty), unit:i.unit, price:num(i.price), supplier:i.supplier||'', maker:i.maker||'', product:i.product||''};
  }
  if(kind==='prep'){
    const p = findPrep(id);
    if(!p) return {qty:null, unit:'g', price:null, supplier:'自家製（仕込み品）', maker:'', product:''};
    const c = calcPrep(p);
    return {qty:c.finished, unit:'g', price:c.totalCost, supplier:'自家製（仕込み品）', maker:'', product:''};
  }
  const k = findPack(id);
  if(!k) return {qty:null, unit:'', price:null, supplier:'', maker:'', product:''};
  return {qty:num(k.qty), unit:k.unit, price:num(k.price), supplier:k.supplier||'', maker:'', product:''};
}
// 「2,500 g」のような規格表示をつくる
function specText(s){
  if(s.qty===null||s.qty===undefined) return '—';
  return fmt(s.qty, (s.qty % 1 === 0) ? 0 : 2) + ' ' + (s.unit||'');
}

// 包材1行の原価
function calcPackLine(row){
  const p = findPack(row.packId);
  const out = {name: p?p.name:'（削除された包材）', qty:num(row.qty), cost:null, errors:[]};
  if(!p){ out.errors.push('この包材は登録されていません'); return out; }
  const price = num(p.price), qty = num(p.qty);
  if(price===null||price<0||qty===null||qty<=0){ out.errors.push(p.name+'：包材の購入価格（税抜）と正の入数を入力してください'); return out; }
  if(out.qty===null||out.qty<0){ out.errors.push(p.name+'：使用数は0以上で入力してください'); return out; }
  out.unitCost = price/qty;
  out.cost = out.unitCost*out.qty;
  return out;
}

// メニュー1件の計算
function calcMenu(menu){
  const r = {lines:[], packLines:[], foodCost:null, packCost:null, totalCost:null,
             perServeFood:null, perServePack:null, perServeTotal:null,
             price:null, profit:null, costRate:null, profitRate:null,
             nutriTotal:null, nutriPerServe:null, nutriPer100g:null, nutriMissing:[], missingSources:[],
             allergens:{}, unknownAllergenBy:{}, errors:[], warns:[], hints:[],
             servings:null, servingWeight:null, inputWeight:null, totalWeight:null, processYieldRate:null, costPerKg:null};
  const costs=[]; const total=emptyNutri(); const flags={}; const allergenSrc=[]; let gramsSum=0; let gramsOk=true;
  (menu.items||[]).forEach(it=>{
    const L = calcLine(it, []);
    r.lines.push(L);
    L.errors.forEach(e=>r.errors.push(e));
    if(L.cost!==null) costs.push(L.cost);
    addNutri(total, L.nutri, flags);
    if(L.grams===null) gramsOk=false; else gramsSum += L.grams;
    if(L.ref && L.ref.allergens) allergenSrc.push({name:L.ref.name, allergens:L.ref.allergens});
    if(L.ref && L.ref.nutriMissing && L.ref.nutriMissing.length) r.missingSources.push(L.ref.name);
    if(L.ref && L.ref.nutriNote) r.warns.push(L.ref.name+'：'+L.ref.nutriNote);
  });
  (menu.packs||[]).forEach(p=>{
    const P = calcPackLine(p);
    r.packLines.push(P);
    P.errors.forEach(e=>r.errors.push(e));
  });
  // 1行でも原価不明なら部分原価を合計に流さない。
  r.foodCost = r.lines.length && r.lines.every(L=>L.cost!==null) ? sumMoney(costs) : null;
  r.packCost = r.packLines.every(P=>P.cost!==null) ? sumMoney(r.packLines.map(P=>P.cost)) : null;
  r.totalCost = r.foodCost!==null && r.packCost!==null ? sumMoney([r.foodCost,r.packCost]) : null;
  const ag = mergeAllergens(allergenSrc);
  r.allergens = ag.map; r.unknownAllergenBy = ag.unknownBy;
  r.nutriTotal = finalizeNutri(total, flags);
  NUTRIENTS.forEach(x=>{ if(flags[x.k] && x.req) r.nutriMissing.push(x.name); });

  const servings = num(menu.servings);
  r.servings = servings;
  if(servings===null||servings<=0){
    r.hints.push('「レシピ全体で作れる食数」を入力すると、1食当たりの原価と原価率を計算します。');
  }else{
    r.perServeFood  = r.foodCost===null ? null : r.foodCost/servings;
    r.perServePack  = r.packCost===null ? null : r.packCost/servings;
    r.perServeTotal = r.totalCost===null ? null : r.totalCost/servings;
    r.nutriPerServe = scaleNutri(r.nutriTotal, 1/servings);
  }
  // 1食の提供量。未入力ならレシピ全体重量÷食数で補う
  let sw = num(menu.servingSize);
  const totalYield = num(menu.totalYield);
  r.inputWeight = gramsOk ? gramsSum : null;
  // 仕上がり量は投入量から推測しない。加熱・水切り・掃除などの目減り後を実測入力する。
  r.totalWeight = (totalYield!==null && totalYield>0) ? totalYield : null;
  if(r.inputWeight!==null && r.inputWeight>0 && totalYield!==null && totalYield>0) r.processYieldRate=totalYield/r.inputWeight*100;
  if(r.foodCost!==null && r.totalWeight!==null && r.totalWeight>0) r.costPerKg=r.foodCost/r.totalWeight*1000;
  if(sw===null && r.totalWeight!==null && servings>0) sw = r.totalWeight/servings;
  r.servingWeight = sw;
  if(r.nutriPerServe && sw!==null && sw>0) r.nutriPer100g = scaleNutri(r.nutriPerServe, 100/sw);
  else if(r.nutriTotal && r.totalWeight>0) r.nutriPer100g = scaleNutri(r.nutriTotal, 100/r.totalWeight);
  if(sw===null) r.hints.push('「1食の提供量（g）」または「レシピ全体の仕上がり量（g）」を入力すると、100g当たりの栄養成分を計算します。');

  const price = num(menu.price);
  r.price = price;
  if(price===null||price<=0){
    r.hints.push('「販売価格」を入力すると、粗利益と原価率を計算します。');
  }else if(menu.taxType==='incl' && excludingTax(price,menu.taxType,menu.taxRate)===null){
    r.hints.push('税込販売価格の税率（8％または10％）を選ぶと、税抜の粗利益・原価率を計算できます。');
  }else if(r.perServeTotal!==null){
    const netPrice=excludingTax(price,menu.taxType,menu.taxRate);
    r.profit     = netPrice - r.perServeTotal;
    r.costRate   = r.perServeTotal/netPrice*100;
    r.profitRate = r.profit/netPrice*100;
  }
  return r;
}
// 候補価格1件の比較結果
function compareAtPrice(perServeTotal, price, taxType, taxRate){
  if(perServeTotal===null||price===null||price<=0) return null;
  const netPrice=excludingTax(price,taxType,taxRate);
  if(netPrice===null) return null;
  return {price:price, cost:perServeTotal, rate:perServeTotal/netPrice*100,
          profit:netPrice-perServeTotal, profitRate:(netPrice-perServeTotal)/netPrice*100};
}

// 入力欄。数値欄には数字以外を入力できないようにする
function inputEl(opts){
  const o = opts||{};
  const n = el('input',{type:o.type||'text', value:(o.value===null||o.value===undefined)?'':String(o.value),
    placeholder:o.placeholder||'', readonly:o.readonly||false});
  if(o.type==='number'){ n.setAttribute('inputmode','decimal'); n.setAttribute('step', o.step||'any'); }
  if(o.min!==undefined) n.setAttribute('min', o.min);
  if(o.onInput) n.addEventListener('input', ()=>o.onInput(n.value, n));
  if(o.onChange) n.addEventListener('change', ()=>o.onChange(n.value, n));
  if(o.type==='number'){
    // マイナス値を入力したら警告する
    n.addEventListener('change', ()=>{
      const v = num(n.value);
      if(v!==null && v<0 && !o.allowNegative){ toast('マイナスの数値は入力できません。0以上の数値を入力してください。', true); n.value=''; if(o.onChange) o.onChange('', n); if(o.onInput) o.onInput('', n); }
    });
  }
  return n;
}
function field(labelText, control, opts){
  const o = opts||{};
  const lb = el('span',{class:'lb'},[labelText]);
  if(o.req) lb.appendChild(el('span',{class:'req', text:'必須'}));
  if(o.help) lb.appendChild(document.createTextNode(' ')), lb.appendChild(helpBtn(o.help));
  const wrap = el('label',{class:'f'},[lb, control]);
  if(o.hint) wrap.appendChild(el('div',{class:'hint', text:o.hint}));
  return wrap;
}
function selectEl(options, value, onChange, opts){
  const s = el('select');
  (opts&&opts.blank ? [{v:'',t:opts.blank}] : []).concat(
    options.map(o=> typeof o==='string' ? {v:o,t:o} : o)
  ).forEach(o=>{
    const op = el('option',{value:o.v, text:o.t});
    if(String(value||'')===String(o.v)) op.selected = true;
    s.appendChild(op);
  });
  if(opts&&opts.disabled) s.disabled = true;
  s.addEventListener('change', ()=>onChange(s.value));
  return s;
}
function unitSelect(value, onChange){ return selectEl(UNIT_KEYS, value||'g', onChange); }
function calcBox(text){ return el('div',{class:'calcbox mono', text:(text===null||text===undefined)?'—':String(text)}); }
function msg(kind, text, list){

  if(list && list.length){

    list.forEach(x=>ul.appendChild(el('li',{text:x})));

}

let modalStack = [];
function openModal(node, wide){
  const root = $('#modalRoot');
  const box = el('div',{class:'modal'+(wide?' wide':'')},[node]);
  clear(root).appendChild(box);
  root.classList.add('on');
  modalStack.push(box);
  root.scrollTop = 0;
  return box;
}
function closeModal(){
  modalStack.pop();
  const root = $('#modalRoot');
  clear(root); root.classList.remove('on');
}
function alertModal(title, text){
  const body = el('div',{},[ el('h3',{text:title}), el('p',{text:text}),
    el('div',{class:'modal-foot'},[ el('button',{class:'btn primary', onclick:closeModal},['閉じる']) ]) ]);
  openModal(body);
}
function confirmModal(title, text, okLabel, onOk, opts){
  const o = opts||{};
  const body = el('div');
  body.appendChild(el('h3',{text:title}));
  String(text).split('\n').forEach(t=>body.appendChild(el('p',{text:t})));
  let confirmInput = null;
  if(o.typeToConfirm){
    body.appendChild(msg('warn','この操作は取り消せません。続けるには下の欄に「'+o.typeToConfirm+'」と入力してください。'));
    confirmInput = inputEl({placeholder:o.typeToConfirm});
    body.appendChild(confirmInput);
  }
  const okBtn = el('button',{class:'btn '+(o.danger?'danger':'primary'), onclick:()=>{
    if(confirmInput && confirmInput.value.trim()!==o.typeToConfirm){ toast('入力内容が一致しません。', true); return; }
    closeModal(); onOk();
  }},[okLabel||'実行する']);
  body.appendChild(el('div',{class:'modal-foot'},[
    el('button',{class:'btn', onclick:closeModal},['キャンセル']), okBtn ]));
  openModal(body);
}

function go(id, params){
  // 食材の編集中に別画面へ移るときは、保存していない内容を確認する
  if(id!=='home' && id!=='settings' && !GH.base){
    toast('非公開データを読み込んでから操作してください。',true); return;

function duplicateIng(id){
  const src = findIng(id); if(!src) return;
  const c = deepCopy(src);
  c.id = uid('ing'); c.code = nextCode('ing','I'); c.name = src.name+'（コピー）';
  DATA.ingredients.push(c); markDirty(); render(); toast('食材を複製しました。');
}
function deleteIng(id){
  const ing = findIng(id); if(!ing) return;
  const usedPreps = DATA.preps.filter(p=>(p.items||[]).some(it=>it.refType==='ing'&&it.refId===id));
  const usedMenus = DATA.menus.filter(m=>(m.items||[]).some(it=>it.refType==='ing'&&it.refId===id));
  let text = '「'+ing.name+'」を削除します。';
  if(usedPreps.length||usedMenus.length){
    text += '\nこの食材は以下で使用されています。削除すると、そこでの原価が計算できなくなります。\n'
         + (usedPreps.length?'仕込み品：'+usedPreps.map(p=>p.name).join('、')+'\n':'')
         + (usedMenus.length?'メニュー：'+usedMenus.map(m=>m.name).join('、'):'');
  }
  confirmModal('食材を削除しますか？', text, '削除する', ()=>{
    DATA.ingredients = DATA.ingredients.filter(x=>x.id!==id);
    markDirty(); render(); toast('食材を削除しました。');
  }, {danger:true});
}

function saveIng(ing, isNew, onDone){
  if(!String(ing.name||'').trim()){ toast('食材名を入力してください。', true); return; }
  const c = calcIngredient(ing);
  if(c.errors.length){
    confirmModal('入力に不足があります', c.errors.join('\n')+'\nこのまま保存すると、この食材を使ったメニューの原価は計算されません。', '不足のまま保存する', ()=>doSaveIng(ing,isNew,onDone));
    return;
  }
  doSaveIng(ing,isNew,onDone);
}
function doSaveIng(ing, isNew, onDone){
  if(isNew){
    ing.code = nextCode('ing','I');
    DATA.ingredients.push(ing);
  }else{
    const old = findIng(ing.id);
    // 価格が変わった場合は履歴を残す（変更前の金額と更新日）
    if(old && num(old.price)!==num(ing.price)){
      DATA.priceHistory.push({id:uid('ph'), targetType:'ing', targetId:ing.id, name:ing.name,
        oldPrice:num(old.price), newPrice:num(ing.price), oldQty:num(old.qty), oldUnit:old.unit,
        changedAt: nowStr()});
      ing.priceUpdatedAt = todayStr();
    }
    const i = DATA.ingredients.findIndex(x=>x.id===ing.id);
    DATA.ingredients[i] = ing;
  }
  markDirty(); closeModal();
  // 価格は参照方式で保持しているため、仕込み品・メニューの原価は再計算時に自動反映される
  if(onDone) onDone(ing); else render();
  toast(isNew?'食材を登録しました。':'食材の変更を保存しました。関連する仕込み品とメニューへ自動で反映されます。');
}

   8. 材料の選択（食材・仕込み品を検索して追加する共通部品）
   ============================================================ */
function pickMaterial(opts, onPick){
  const o = opts||{};
  const body = el('div');
  body.appendChild(el('h3',{text:'材料を選ぶ'}));
  const q = inputEl({placeholder:'名前で検索（例：トマト、ソース）'});
  body.appendChild(field('検索', q));
  const listBox = el('div');
  body.appendChild(listBox);
  function build(){
    clear(listBox);
    const kw = q.value.trim().toLowerCase();
    const rows = [];
    if(o.allowPrep!==false){
      DATA.preps.forEach(p=>{
        if(kw && p.name.toLowerCase().indexOf(kw)<0) return;
        const blocked = o.forPrepId ? wouldCycle(o.forPrepId,'prep',p.id) : false;
        rows.push({type:'prep', id:p.id, name:p.name, sub:'仕込み品 / '+(p.category||'—'), blocked:blocked});
      });
    }
    DATA.ingredients.forEach(i=>{
      if(!i.active) return;
      if(kw && [i.name,i.dispName,i.maker,i.product].join(' ').toLowerCase().indexOf(kw)<0) return;
      rows.push({type:'ing', id:i.id, name:i.name, sub:'食材 / '+(i.category||'—')+' / '+(i.supplier||'仕入先未登録')});
    });
    if(!rows.length){
      listBox.appendChild(el('div',{class:'empty'},['該当する材料がありません。先に食材を登録してください。']));
      return;
    }
    const t = el('table',{class:'dt'});
    t.appendChild(el('thead',{},[el('tr',{},['種類','名前','単位原価','　'].map(h=>el('th',{text:h})))]));
    const tb = el('tbody');
    rows.slice(0,300).forEach(r=>{
      const ref = resolveRef(r.type, r.id, []);
      tb.appendChild(el('tr',{},[
        el('td',{text: r.type==='prep'?'仕込み品':'食材'}),
        el('td',{},[el('div',{text:r.name}), el('div',{class:'hint',text:r.sub})]),
        el('td',{class:'num', text: ref.unitCost==null?'未確定':unitCostText(ref.unitCost)+' /'+(ref.baseLabel||ref.base||'')}),
        el('td',{},[ r.blocked
          ? el('span',{class:'pill y', text:'循環参照のため選べません'})
          : el('button',{class:'btn sm primary', onclick:()=>{ closeModal(); onPick(r.type, r.id); }},['選ぶ']) ])
      ]));
    });
    t.appendChild(tb);
    listBox.appendChild(el('div',{class:'tablewrap'},[t]));
    if(rows.length>300) listBox.appendChild(el('div',{class:'hint',text:'先頭300件を表示しています。検索で絞り込んでください。'}));
  }
  q.addEventListener('input', build);
  build();
  body.appendChild(el('div',{class:'modal-foot'},[
    el('button',{class:'btn', onclick:()=>{closeModal(); editIngredient(null, ()=>{});}},['ここで新しい食材を登録する']),
    el('button',{class:'btn', onclick:closeModal},['閉じる'])
  ]));
  openModal(body, true);
}

function nutriTable(n, partial){
  const t = el('table',{class:'dt'});
  t.appendChild(el('thead',{},[el('tr',{},[el('th',{text:'項目'}),el('th',{class:'num',text:'値'}),el('th',{text:'状態'})])]));
  const tb = el('tbody');
  NUTRIENTS.forEach(x=>{
    const v = n[x.k];
    const d = DATA.settings.decimals[x.k];
    tb.appendChild(el('tr',{},[
      el('td',{text:x.name}),
      el('td',{class:'num', text: v===null||v===undefined ? '—' : fmtRound(v,d)+' '+x.unit}),
      el('td',{},[ v===null||v===undefined ? el('span',{class:'pill y',text:'未入力'}) : el('span',{class:'pill g',text:'計算済み'}) ])
    ]));

  return box;

// 設定に従って丸める（表示専用）
function fmtRound(v, d){
  if(v===null||v===undefined||!Number.isFinite(v)) return '—';
  d = (d===undefined||d===null)?1:d;
  const m = Math.pow(10,d);
  const mode = DATA.settings.rounding;
  let x = v*m;
  x = mode==='floor' ? Math.floor(x+1e-9) : (mode==='ceil' ? Math.ceil(x-1e-9) : Math.round(x+(v>=0?1e-9:-1e-9)));
  return (x/m).toLocaleString('ja-JP',{minimumFractionDigits:d, maximumFractionDigits:d});
}
/* アレルゲン表示 */
function allergenView(map, unknownBy){
  const box = el('div');
  const ins = ALLERGEN_ALL.filter(a=>map[a]==='in');
  const unk = ALLERGEN_ALL.filter(a=>map[a]==='unknown');
  const chips = el('div',{class:'chips'});
  if(ins.length) ins.forEach(a=>chips.appendChild(el('span',{class:'chip on', text:a+(ALLERGEN_MAIN.indexOf(a)>=0?'（特定原材料）':'')})));
  else chips.appendChild(el('span',{class:'chip', text:'「含む」と登録された品目はありません'}));
  box.appendChild(chips);
  if(unk.length){
    const names = Array.from(new Set([].concat.apply([], unk.map(a=>unknownBy[a]||[]))));
    box.appendChild(msg('warn','未確認のアレルゲンがあります（'+unk.length+'品目）。次の材料でアレルゲンが未確認です。', names));
    box.appendChild(el('div',{class:'chips'}, unk.map(a=>el('span',{class:'chip unk', text:a}))));
  }
  return box;
}

function createMenu(){
  const m = newMenu(); m.code = nextCode('menu','M');
  DATA.menus.push(m); markDirty(); go('menus',{id:m.id, step:1});
}
function filteredMenus(){
  const q = menuFilter.q.trim().toLowerCase();
  let list = DATA.menus.filter(m=>{
    if(menuFilter.cat && m.category!==menuFilter.cat) return false;
    if(q && m.name.toLowerCase().indexOf(q)<0) return false;
    return true;
  });
  const rate = m=>{ const c = calcMenu(m); return c.costRate===null? -1 : c.costRate; };
  if(menuFilter.sort==='rate') list.sort((a,b)=>rate(b)-rate(a));
  else if(menuFilter.sort==='rate_a') list.sort((a,b)=>{const x=rate(a),y=rate(b); return (x<0?9999:x)-(y<0?9999:y);});
  else if(menuFilter.sort==='name') list.sort((a,b)=>a.name.localeCompare(b.name,'ja'));
  else list.sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));
  return list;
}

/* 販売価格の比較（システムからの価格提案は行わない） */

    clear(box);
    box.appendChild(el('div',{class:'row noprint', style:{marginBottom:'10px'}},[

    const t = el('table',{class:'dt'});
    t.appendChild(el('thead',{},[el('tr',{},['候補販売価格','1食当たり原価','原価率','粗利益','粗利益率','操作']
      .map(h=>el('th',{class:(h!=='操作'?'num':''),text:h})))]));
    const tb = el('tbody');
    m.candidates.forEach((cd,idx)=>{
      const r = compareAtPrice(c.perServeTotal, num(cd.price), m.taxType, m.taxRate);
      tb.appendChild(el('tr',{},[
        el('td',{},[ inputEl({type:'number', value:cd.price, onInput:v=>{ cd.price=(v===''?null:num(v)); touch(); build(); }, placeholder:'例：1500'}) ]),

        el('td',{class:'noprint'},[ el('button',{class:'btn sm danger', onclick:()=>{ m.candidates.splice(idx,1); touch(); build(); }},['削除']) ])

}

/* 栄養成分表示 */
function nutriPanel(m, c){
  const p = el('div',{class:'panel'});
  p.appendChild(el('h3',{text:'栄養成分表示'}));
  let basis = '1食';
  const ctl = el('div',{class:'row noprint'});
  const box = el('div',{style:{marginTop:'12px'}});
  ['1食','100g','全量'].forEach(b=>{
    ctl.appendChild(el('button',{class:'btn'+(b===basis?' primary':''), onclick:()=>{ basis=b; paint(); }},
      [b==='1食'?'1食当たり':(b==='100g'?'100g当たり':'レシピ全量')]));
  });
  p.appendChild(ctl);
  p.appendChild(box);
  function paint(){
    Array.prototype.forEach.call(ctl.children,(b,i)=>{ b.className='btn'+((['1食','100g','全量'][i])===basis?' primary':''); });
    clear(box);
    const missingNames = Array.from(new Set(c.missingSources));
    if(missingNames.length) box.appendChild(msg('warn','栄養成分未入力の食材があります。この表示は「一部未入力」です。', missingNames));
    const vals = basis==='1食' ? c.nutriPerServe : (basis==='100g' ? c.nutriPer100g : c.nutriTotal);
    if(!vals){ box.appendChild(msg('info','この表示には、ステップ1の食数や1食の提供量の入力が必要です。')); return; }
    const head = basis==='1食' ? ('1食（'+(c.servingWeight===null?'—':fmt(c.servingWeight,0)+'g')+'）当たり')
               : (basis==='100g' ? '100g当たり' : 'レシピ全量（'+(c.totalWeight===null?'—':fmt(c.totalWeight,0)+'g')+'）当たり');
    const lb = el('div',{class:'nutlabel'});
    lb.appendChild(el('h4',{text:'栄養成分表示'}));
    lb.appendChild(el('div',{class:'hint', text:head}));
    const t = el('table');
    NUTRIENTS.filter(x=>x.req||vals[x.k]!==null&&vals[x.k]!==undefined).forEach(x=>{
      const v = vals[x.k];
      t.appendChild(el('tr',{},[ el('td',{text:x.name}),
        el('td',{text: (v===null||v===undefined) ? '未入力' : (fmtRound(v, DATA.settings.decimals[x.k])+' '+x.unit)}) ]));
    });
    lb.appendChild(t);
    lb.appendChild(el('div',{class:'note', text: missingNames.length ? '※ 一部未入力（この値は確定値ではありません）' : '※ 推定値'}));
    box.appendChild(lb);
    box.appendChild(el('div',{style:{marginTop:'14px'}},[nutriTable(vals, missingNames.length>0)]));
  }
  paint();
  return p;
}

/* 原材料表示の作成補助 */
function ingredientLabelPanel(m){
  const p = el('div',{class:'panel'});
  p.appendChild(el('h3',{text:'原材料表示の作成補助'}));
  p.appendChild(msg('warn','これは表示案を作るための補助機能です。実際の商品表示は、法令に基づく最終確認が必要です。'));
  let expand = true;
  const ctl = el('div',{class:'row noprint'});
  const cb = el('input',{type:'checkbox'}); cb.checked = true;
  cb.addEventListener('change', ()=>{ expand = cb.checked; paint(); });
  ctl.appendChild(el('label',{},[cb, ' 仕込み品の材料を展開して表示する']));
  p.appendChild(ctl);
  const box = el('div'); p.appendChild(box);
  function collect(items, factor, out, depth){
    items.forEach(it=>{
      const L = calcLine(it, []);
      if(!L.ref || !L.ref.ok) return;
      const grams = (L.grams===null?0:L.grams)*factor;
      if(expand && L.ref.kind==='prep'){
        const prep = findPrep(L.ref.id);
        const pc = calcPrep(prep);
        if(pc.finished>0 && depth<4){
          collect(prep.items||[], grams/pc.finished, out, depth+1);
          return;
        }
      }
      const key = L.ref.dispName || L.ref.name;
      out[key] = (out[key]||0) + grams;
    });
  }
  function paint(){
    clear(box);
    const acc = {};
    collect(m.items||[], 1, acc, 0);
    const rows = Object.keys(acc).map(k=>({name:k, g:acc[k]})).sort((a,b)=>b.g-a.g);
    if(!rows.length){ box.appendChild(el('div',{class:'empty'},['材料がまだ登録されていません。'])); return; }
    const c = calcMenu(m);
    const ins = ALLERGEN_ALL.filter(a=>c.allergens[a]==='in');
    const unk = ALLERGEN_ALL.filter(a=>c.allergens[a]==='unknown');
    const text = rows.map(r=>r.name).join('、')
      + (ins.length? '\n（一部に'+ins.join('・')+'を含む）' : '');
    const t = el('table',{class:'dt'});
    t.appendChild(el('thead',{},[el('tr',{},[el('th',{text:'順'}),el('th',{text:'表示用食材名'}),el('th',{class:'num',text:'使用重量'})])]));
    const tb = el('tbody');
    rows.forEach((r,i)=>tb.appendChild(el('tr',{},[el('td',{text:String(i+1)}),el('td',{text:r.name}),el('td',{class:'num',text:fmt(r.g,1)+' g'})])));
    t.appendChild(tb);
    box.appendChild(el('div',{class:'tablewrap'},[t]));
    const ta = el('textarea',{style:{marginTop:'12px', minHeight:'90px'}}); ta.value = text; ta.readOnly = true;
    box.appendChild(el('div',{class:'lb', text:'表示案（重量の多い順）'}));
    box.appendChild(ta);
    if(unk.length) box.appendChild(msg('warn','アレルゲンが未確認の品目が'+unk.length+'件あります。表示前に必ず確認してください。'));
    box.appendChild(el('div',{class:'row noprint', style:{marginTop:'8px'}},[
      el('button',{class:'btn', onclick:()=>{ ta.select(); try{ document.execCommand('copy'); toast('表示案をコピーしました。'); }catch(e){ toast('コピーできませんでした。手動で選択してコピーしてください。', true); } }},['テキストをコピーする']),
      el('button',{class:'btn', onclick:()=>printMenu(m.id)},['印刷する'])
    ]));
  }
  paint();
  return p;
}

let purchaseFilter={q:'',category:'',selected:''};
function purchaseText(v){ return String(v||'').normalize('NFKC'); }
function purchaseProducts(rows){
  const map={};
  rows.forEach(h=>{
    const key=h.productCode||h.productName;
    const x=map[key]||(map[key]={code:key,name:purchaseText(h.productName),category:purchaseText(h.category),
      pack:purchaseText(h.pack),rows:[],qty:0,amount:0,zero:0});
    x.rows.push(h); x.qty+=(num(h.quantity)||0); x.amount+=(num(h.amount)||0);
    if(num(h.unitPrice)===0) x.zero++;
  });
  return Object.values(map).map(x=>{
    x.rows.sort((a,b)=>String(a.orderedAt).localeCompare(String(b.orderedAt)));
    const priced=x.rows.filter(h=>num(h.unitPrice)>0);
    x.last=x.rows[x.rows.length-1]||null;
    x.lastPriced=priced[priced.length-1]||null;
    x.previousPriced=priced.length>1?priced[priced.length-2]:null;
    x.delta=x.lastPriced&&x.previousPriced?num(x.lastPriced.unitPrice)-num(x.previousPriced.unitPrice):null;
    return x;
  }).sort((a,b)=>String(b.last&&b.last.orderedAt).localeCompare(String(a.last&&a.last.orderedAt)));
}

function csvEscape(v){
  const s = (v===null||v===undefined)?'':String(v);
  return /[",\n\r]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function toCsv(rows){
  // Excelで文字化けしないよう BOM 付き UTF-8、改行は CRLF
  return '﻿' + rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
}
function downloadFile(name, content, mime){
  const blob = new Blob([content], {type: mime||'text/csv;charset=utf-8'});
  const url = URL.createObjectURL(blob);
  const a = el('a',{href:url, download:name});
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}

// CSV文字列を配列に分解（引用符に対応）
function parseCsv(text){
  if(text.charCodeAt(0)===0xFEFF) text = text.slice(1);
  const rows=[]; let row=[]; let cur=''; let q=false;
  for(let i=0;i<text.length;i++){
    const ch = text[i];
    if(q){
      if(ch==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; }
      else cur+=ch;
    }else{
      if(ch==='"') q=true;
      else if(ch===','){ row.push(cur); cur=''; }
      else if(ch==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(ch==='\r'){ /* 無視 */ }
      else cur+=ch;
    }
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}

// 読み込んだデータに不足項目があれば補う（データ形式のバージョン管理）
function migrate(d){
  const base = emptyData();
  const out = Object.assign(base, d);
  out.version = DATA_VERSION;
  out.settings = Object.assign(base.settings, d.settings||{});
  out.settings.company = Object.assign(base.settings.company, (d.settings&&d.settings.company)||{});
  out.settings.decimals = Object.assign(base.settings.decimals, (d.settings&&d.settings.decimals)||{});
  out.seq = Object.assign(base.seq, d.seq||{});
  ['ingredients','packages','preps','menus','priceHistory','purchaseHistory'].forEach(k=>{ if(!Array.isArray(out[k])) out[k]=[]; });
  out.ingredients.forEach(i=>{
    i.nutri = Object.assign({basis:'100g'}, i.nutri||{});
    i.allergens = i.allergens||{};
    if(i.active===undefined) i.active = true;
  });
  out.menus.forEach(m=>{ m.items=m.items||[]; m.packs=m.packs||[]; m.candidates=m.candidates||[];
    if(m.wholesalePrice===undefined) m.wholesalePrice=null;
    if(m.partnerRetailPrice===undefined) m.partnerRetailPrice=null;
    m.items.forEach(it=>{
      if(it.yieldRate===undefined && it.refType==='ing'){
        const ing=out.ingredients.find(x=>x.id===it.refId);
        it.yieldRate=ing && num(ing.yieldRate)!==null ? num(ing.yieldRate) : 100;
      }
    });
    m.spec = Object.assign({label:'',net:'',sizeW:'',sizeD:'',sizeT:'',sizeWeight:'',caseSize:'',perCase:'',
      jan:'なし',itf:'なし',packing:'',shelfLife:'',storage:'冷凍(-18℃以下)',contami:'',remark:''}, m.spec||{});
  });
  out.preps.forEach(p=>{ p.items=p.items||[]; });
  // 採番が実データより小さい場合は引き上げる
  const maxN = (arr,pfx)=>arr.reduce((n,x)=>Math.max(n, Number(String(x.code||'').replace(pfx,''))||0), 0);
  out.seq.ing  = Math.max(out.seq.ing||0,  maxN(out.ingredients,'I'));
  out.seq.pack = Math.max(out.seq.pack||0, maxN(out.packages,'P'));
  out.seq.prep = Math.max(out.seq.prep||0, maxN(out.preps,'R'));
  out.seq.menu = Math.max(out.seq.menu||0, maxN(out.menus,'M'));
  return out;
}

/* --- 原産地（規格書に記載のあったもの） --- */
const SEED_ORIGIN = [];
function applyOrigins(){
  let n=0;
  SEED_ORIGIN.forEach(r=>{
    const ing = DATA.ingredients.find(x=>x.name===r[0]) || DATA.ingredients.find(x=>x.dispName===r[0])
      || DATA.ingredients.find(x=>x.name.indexOf(r[0])===0);
    if(ing && !ing.origin){ ing.origin = r[1]; n++; }
  });
  return n;
}

/* 原材料を使用重量の多い順に並べ、産地つきで返す */
function specIngredientRows(m){
  const acc = {};
  (function collect(items, factor, depth){
    (items||[]).forEach(it=>{
      const L = calcLine(it, []);
      if(!L.ref || !L.ref.ok) return;
      const grams = (L.grams===null?0:L.grams)*factor;
      if(L.ref.kind==='prep' && depth<4){
        const prep = findPrep(L.ref.id); const pc = calcPrep(prep);
        if(pc && pc.finished>0){ collect(prep.items||[], grams/pc.finished, depth+1); return; }
      }
      const ing = L.ref.kind==='prep' ? null : findIng(L.ref.id);
      const key = L.ref.dispName || L.ref.name;
      if(!acc[key]) acc[key] = {name:key, g:0, origin:(ing&&ing.origin)||''};
      acc[key].g += grams;
      if(!acc[key].origin && ing && ing.origin) acc[key].origin = ing.origin;
    });
  })(m.items||[], 1, 0);
  return Object.keys(acc).map(k=>acc[k]).sort((a,b)=>b.g-a.g);
}
function specMaterialText(m, withOrigin){
  return specIngredientRows(m).map(r=> r.name + (withOrigin && r.origin ? '（'+r.origin+'）' : '')).join('、');
}
function specSizeText(sp){
  const a=[];
  if(sp.sizeW) a.push('縦'+sp.sizeW+'ｍｍ');
  if(sp.sizeD) a.push('横'+sp.sizeD+'ｍｍ');
  if(sp.sizeT) a.push('厚さ'+sp.sizeT+'ｍｍ');
  if(sp.sizeWeight) a.push('重さ'+sp.sizeWeight+'ｇ');
  return a.join(' ');
}

  p.appendChild(prev);

  ]));

}

  const tb = el('tbody');

    const it = (m.items||[])[idx] || {};
    const sp = refSpec(it.refType, it.refId);
    tb.appendChild(el('tr',{},[el('td',{text:L.name}), el('td',{text:L.ref&&L.ref.kind==='prep'?'仕込み品':'食材'}),
      el('td',{text:sp.supplier||'—'}),
      el('td',{class:'num',text:specText(sp)}),
      el('td',{class:'num',text:sp.price===null?'—':yen(sp.price,2)}),
      el('td',{class:'num',text:L.ref&&L.ref.unitCost!=null?unitCostText(L.ref.unitCost)+' /'+(L.ref.baseLabel||L.ref.base):'—'}),
      el('td',{class:'num',text:L.qty===null?'—':fmt(L.qty,2)+' '+L.unit}),
      el('td',{class:'num',text:L.cost===null?'—':yen(L.cost,2)})]));
  });
  c.packLines.forEach((P,idx)=>{
    const row = (m.packs||[])[idx] || {};
    const sp = refSpec('pack', row.packId);
    tb.appendChild(el('tr',{},[el('td',{text:P.name}),el('td',{text:'包材'}),
      el('td',{text:sp.supplier||'—'}),
      el('td',{class:'num',text:specText(sp)}),
      el('td',{class:'num',text:sp.price===null?'—':yen(sp.price,2)}),
      el('td',{class:'num',text:P.unitCost==null?'—':unitCostText(P.unitCost)+' /個'}),
      el('td',{class:'num',text:P.qty===null?'—':fmt(P.qty,0)}),
      el('td',{class:'num',text:P.cost===null?'—':yen(P.cost,2)})]));
  });
  t.appendChild(tb);
  root.appendChild(el('div',{class:'panel'},[el('h3',{text:'材料別 原価明細'}), el('div',{class:'tablewrap'},[t])]));
  // 栄養成分
  const np = el('div',{class:'panel'});
  np.appendChild(el('h3',{text:'栄養成分表示'}));
  const missing = Array.from(new Set(c.missingSources));
  ['1食','100g'].forEach(b=>{
    const vals = b==='1食'? c.nutriPerServe : c.nutriPer100g;
    if(!vals) return;
    const lb = el('div',{class:'nutlabel', style:{display:'inline-block', marginRight:'16px', verticalAlign:'top'}});
    lb.appendChild(el('h4',{text:'栄養成分表示'}));
    lb.appendChild(el('div',{class:'hint', text: b==='1食' ? ('1食（'+(c.servingWeight===null?'—':fmt(c.servingWeight,0)+'g')+'）当たり') : '100g当たり'}));
    const tt = el('table');
    NUTRIENTS.filter(x=>x.req).forEach(x=>{
      const v = vals[x.k];
      tt.appendChild(el('tr',{},[el('td',{text:x.name}), el('td',{text:(v===null||v===undefined)?'未入力':fmtRound(v,DATA.settings.decimals[x.k])+' '+x.unit})]));
    });
    lb.appendChild(tt);
    lb.appendChild(el('div',{class:'note', text: missing.length?'※ 一部未入力':'※ 推定値'}));
    np.appendChild(lb);
  });
  if(missing.length) np.appendChild(msg('warn','栄養成分が未入力の食材：'+missing.join('、')));
  root.appendChild(np);
  // アレルゲン
  const ins = ALLERGEN_ALL.filter(a=>c.allergens[a]==='in');
  const unk = ALLERGEN_ALL.filter(a=>c.allergens[a]==='unknown');
  root.appendChild(el('div',{class:'panel'},[
    el('h3',{text:'アレルゲン一覧'}),
    el('p',{text:'含む：'+(ins.length?ins.join('、'):'なし')}),
    el('p',{text:'未確認：'+(unk.length?unk.join('、'):'なし')})
  ]));
  // 原材料表示案
  const acc = {};
  (function collect(items, factor, depth){
    items.forEach(it=>{
      const L = calcLine(it, []);
      if(!L.ref||!L.ref.ok) return;
      const grams = (L.grams===null?0:L.grams)*factor;
      if(L.ref.kind==='prep' && depth<4){
        const prep = findPrep(L.ref.id); const pc = calcPrep(prep);
        if(pc.finished>0){ collect(prep.items||[], grams/pc.finished, depth+1); return; }
      }
      const key = L.ref.dispName||L.ref.name;
      acc[key] = (acc[key]||0)+grams;
    });
  })(m.items||[], 1, 0);
  const order = Object.keys(acc).sort((a,b)=>acc[b]-acc[a]);
  root.appendChild(el('div',{class:'panel'},[
    el('h3',{text:'原材料表示案（使用重量の多い順）'}),
    el('p',{text: order.join('、') + (ins.length?'（一部に'+ins.join('・')+'を含む）':'')}),
    el('p',{class:'hint', text:'※ 法令に基づく最終確認が必要です。'})
  ]));
  // 販売価格比較
  if((m.candidates||[]).length){
    const pt = el('table',{class:'dt'});
    pt.appendChild(el('thead',{},[el('tr',{},['候補販売価格','1食当たり原価','原価率','粗利益','粗利益率'].map(h=>el('th',{class:'num',text:h})))]));
    const ptb = el('tbody');
    m.candidates.forEach(cd=>{
      const r = compareAtPrice(c.perServeTotal, num(cd.price), m.taxType, m.taxRate);
      ptb.appendChild(el('tr',{},[el('td',{class:'num',text:cd.price===null?'—':yen(num(cd.price))}),
        el('td',{class:'num',text:r?yen(r.cost):'—'}), el('td',{class:'num',text:r?pct(r.rate):'—'}),
        el('td',{class:'num',text:r?yen(r.profit):'—'}), el('td',{class:'num',text:r?pct(r.profitRate):'—'})]));
    });
    pt.appendChild(ptb);
    root.appendChild(el('div',{class:'panel'},[el('h3',{text:'販売価格比較表'}), el('div',{class:'tablewrap'},[pt])]));
  }
  document.body.classList.add('printing');
  const done = ()=>{ document.body.classList.remove('printing'); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done);
  setTimeout(()=>{ window.print(); setTimeout(done, 800); }, 80);
}
