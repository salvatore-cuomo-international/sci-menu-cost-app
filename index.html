/* ------------------------------------------------------------
   単価の一括更新（共有スプレッドシートから出したCSVを取り込む）
   ------------------------------------------------------------ */
const PRICE_CSV_HEADER = ['食材名','規格数量','規格単位','購入価格','税区分','仕入先','メーカー','更新日','更新者','備考','税率（％）'];
const PRICE_ALERT_RATE = 20;   // 前回比で何％以上動いたら警告するか

function exportPriceTemplate(){
  const rows = [PRICE_CSV_HEADER.slice()];
  DATA.ingredients.filter(i=>i.active!==false).forEach(i=>{
    rows.push([i.name, i.qty, i.unit, i.price, i.taxType==='incl'?'税込':'税抜',
               i.supplier, i.maker, i.priceUpdatedAt, '', '', i.taxRate]);
  });
  downloadFile('単価共有シート_ひな形.csv', toCsv(rows));
}

function openPriceImport(){
  const body = el('div');
  body.appendChild(el('h3',{text:'単価をCSVで更新する'}));
  body.appendChild(msg('info','共有スプレッドシートから書き出したCSVを読み込み、食材名で照合して単価を更新します。値が入っている欄だけを上書きし、空欄の欄は今の値をそのまま残します。取り込む前に、変わる内容をすべて画面で確認できます。'));
  body.appendChild(el('div',{class:'hint', text:'列の並び：'+PRICE_CSV_HEADER.join(', ')}));
  body.appendChild(el('div',{class:'row noprint', style:{margin:'12px 0'}},[
    el('button',{class:'btn', onclick:exportPriceTemplate},['共有シートのひな形をCSVで出す'])
  ]));
  const fi = el('input',{type:'file', accept:'.csv,text/csv'});
  body.appendChild(fi);
  const preview = el('div');
  body.appendChild(preview);
  body.appendChild(el('div',{class:'modal-foot'},[el('button',{class:'btn', onclick:closeModal},['閉じる'])]));
  fi.addEventListener('change', ()=>{
    const f = fi.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{
      let rows;
      try{ rows = parseCsv(String(fr.result)); }
      catch(e){ clear(preview).appendChild(msg('err','CSVを読み込めませんでした。ファイル形式を確認してください。')); return; }
      if(rows.length<2){ clear(preview).appendChild(msg('err','データ行が見つかりません。1行目は見出し、2行目以降にデータを入れてください。')); return; }
      const head = rows[0].map(x=>String(x).replace(/^\ufeff/,'').trim());
      const col = n => head.indexOf(n);
      const cName = col('食材名');
      if(cName<0){ clear(preview).appendChild(msg('err','「食材名」の列が見つかりません。ひな形のCSVを使ってください。')); return; }
      const plan=[], ng=[];
      rows.slice(1).forEach((r,idx)=>{
        const nm = String(r[cName]||'').trim();
        if(!nm) return;
        const ing = DATA.ingredients.find(x=>x.name===nm) || DATA.ingredients.find(x=>x.dispName===nm);
        if(!ing){ ng.push((idx+2)+'行目：「'+nm+'」という食材は登録されていません'); return; }
        const get = n => { const c=col(n); return c<0?'':String(r[c]===undefined?'':r[c]).trim(); };
        const ch = {ing:ing, name:nm, fields:[], alert:false};
        const newPrice = get('購入価格');
        if(newPrice!==''){
          const v = num(newPrice.replace(/[,¥￥\s]/g,''));
          if(v===null || v<0){ ng.push((idx+2)+'行目：「'+nm+'」の購入価格「'+newPrice+'」が数値として読めません'); return; }
          if(num(ing.price)!==v){
            ch.fields.push({k:'price', label:'購入価格', from:ing.price, to:v});
            const oldV = num(ing.price);
            if(oldV!==null && oldV>0){
              const diff = Math.abs(v-oldV)/oldV*100;
              if(diff >= PRICE_ALERT_RATE){ ch.alert = true; ch.alertText = (v>oldV?'＋':'−')+fmt(diff,1)+'％'; }
            }else if(oldV===null || oldV===0){ ch.alert = true; ch.alertText = '新規'; }
          }
        }
        const newQty = get('規格数量');
        if(newQty!==''){
          const v = num(newQty.replace(/[,\s]/g,''));
          if(v===null || v<=0){ ng.push((idx+2)+'行目：「'+nm+'」の規格数量「'+newQty+'」が数値として読めません'); return; }
          if(num(ing.qty)!==v) ch.fields.push({k:'qty', label:'規格数量', from:ing.qty, to:v});
        }
        const newUnit = get('規格単位');
        if(newUnit!==''){
          if(UNIT_KEYS.indexOf(newUnit)<0){ ng.push((idx+2)+'行目：「'+nm+'」の規格単位「'+newUnit+'」は使えません（'+UNIT_KEYS.join('／')+'）'); return; }
          if(ing.unit!==newUnit) ch.fields.push({k:'unit', label:'規格単位', from:ing.unit, to:newUnit});
        }
        const newTax = get('税区分');
        if(newTax!==''){
          const tv = (newTax==='税込')?'incl':((newTax==='税抜')?'excl':null);
          if(tv===null){ ng.push((idx+2)+'行目：「'+nm+'」の税区分は「税込」か「税抜」と書いてください'); return; }
          if(ing.taxType!==tv) ch.fields.push({k:'taxType', label:'税区分', from:(ing.taxType==='incl'?'税込':'税抜'), to:newTax});
        }
        const newRate=get('税率（％）');
        const effectiveTax=newTax==='税込'?'incl':(newTax==='税抜'?'excl':ing.taxType);
        const rate=newRate===''?num(ing.taxRate):num(newRate);
        if(newRate!=='' && rate!==8 && rate!==10){
          ng.push((idx+2)+'行目：「'+nm+'」の税率は8か10を入力してください'); return;
        }
        if(effectiveTax==='incl' && rate!==8 && rate!==10){
          ng.push((idx+2)+'行目：「'+nm+'」の税込価格には税率（％）が必要です'); return;
        }
        if(newRate!=='' && num(ing.taxRate)!==rate)
          ch.fields.push({k:'taxRate',label:'税率（％）',from:ing.taxRate,to:rate});
        [['仕入先','supplier'],['メーカー','maker']].forEach(p=>{
          const v = get(p[0]);
          if(v!=='' && String(ing[p[1]]||'')!==v) ch.fields.push({k:p[1], label:p[0], from:ing[p[1]], to:v});
        });
        // 備考は上書きせず、今の内容の後ろに書き足す（規格書や推定値の出所を消さないため）
        const nv = get('備考');
        if(nv!=='' && String(ing.note||'').indexOf(nv)<0){
          ch.fields.push({k:'note', label:'備考（書き足し）', from:ing.note, to:(ing.note?ing.note+' ／ ':'')+nv, show:nv});
        }
        if(ch.fields.length) plan.push(ch);
      });
      const box = clear(preview);
      const changed = plan.length;
      const alerts = plan.filter(x=>x.alert);
      box.appendChild(el('div',{class:'grid g4', style:{marginTop:'14px'}},[
        statCard('読み込んだ行', rows.length-1, '行'),
        statCard('変わる食材', changed, '件'),
        statCard('大きく動く単価', alerts.length, '件', PRICE_ALERT_RATE+'％以上'),
        statCard('取り込めない行', ng.length, '行')
      ]));
      if(ng.length) box.appendChild(msg('warn','次の行は取り込みません。食材名がアプリの登録名と一致しているか確認してください。', ng));
      if(alerts.length) box.appendChild(msg('warn','単価が'+PRICE_ALERT_RATE+'％以上動く食材があります。桁の入力間違いがないか確認してください。',
        alerts.map(x=>x.name+'：'+(x.ing.price===null?'未入力':yen(num(x.ing.price)))+' → '+yen(x.fields.filter(f=>f.k==='price')[0].to)+'（'+x.alertText+'）')));
      if(!changed){ box.appendChild(msg('ok','変わる内容はありませんでした。今のデータはすでに最新です。')); return; }
      const t = el('table',{class:'dt'});
      t.appendChild(el('thead',{},[el('tr',{},['','食材名','変わる項目','今の値','新しい値'].map(h=>el('th',{text:h})))]));
      const tb = el('tbody');
      plan.forEach(ch=>{
        ch.fields.forEach((f,i)=>{
          tb.appendChild(el('tr',{},[
            el('td',{},[ ch.alert&&i===0 ? el('span',{class:'pill y', text:'要確認'}) : el('span',{text:''}) ]),
            el('td',{text: i===0?ch.name:''}),
            el('td',{text:f.label}),
            el('td',{class:'num', text: f.k==='price' ? (f.from===null?'未入力':yen(num(f.from))) : String(f.from===null||f.from===undefined||f.from===''?'未入力':f.from)}),
            el('td',{class:'num', text: f.k==='price' ? yen(f.to) : String(f.show!==undefined?('今の内容＋「'+f.show+'」'):f.to)})
          ]));
        });
      });
      t.appendChild(tb);
      box.appendChild(el('div',{class:'tablewrap'},[t]));
      box.appendChild(el('div',{class:'row noprint', style:{marginTop:'12px'}},[
        el('button',{class:'btn primary', onclick:()=>{
          confirmModal('単価を更新しますか？', changed+'件の食材を更新します。変更前の金額は価格履歴に残るので、後から確認できます。', '更新する', ()=>{
            let n=0;
            plan.forEach(ch=>{
              const ing = ch.ing;
              const pf = ch.fields.filter(f=>f.k==='price')[0];
              if(pf){
                DATA.priceHistory.push({id:uid('ph'), targetType:'ing', targetId:ing.id, name:ing.name,
                  oldPrice:num(ing.price), newPrice:pf.to, oldQty:num(ing.qty), oldUnit:ing.unit,
                  changedAt: nowStr()+'（CSV取込）'});
                ing.priceUpdatedAt = todayStr();
              }
              ch.fields.forEach(f=>{ ing[f.k] = f.to; });
              n++;
            });
            DATA.settings.lastPriceImport = todayStr();
            markDirty(); closeModal(); render();
            toast(n+'件の食材の単価を更新しました。');
          });
        }},['この内容で更新する']),
        el('button',{class:'btn', onclick:closeModal},['やめる'])
      ]));
    };
    fr.readAsText(f, 'utf-8');
  });
  openModal(body, true);
}

function openNutriImport(){
  const body = el('div');
  body.appendChild(el('h3',{text:'栄養成分・アレルゲンをCSVで更新する'}));
  body.appendChild(msg('info','商品表示シールの内容をまとめて反映するための機能です。「栄養成分一覧をCSV出力」で出したファイルを編集して読み込んでください。食材名で照合し、値が入っている欄だけを上書きします。空欄の欄は今の値をそのまま残します。'));
  body.appendChild(el('div',{class:'hint', text:'列の並び：'+NUTRI_CSV_HEADER.join(', ')}));
  body.appendChild(el('div',{class:'hint', text:'「含むアレルゲン」は中黒（・）で区切って書きます。例：小麦・乳・卵。「アレルゲン確認済み」に「はい」と書くと、書かれていない品目は「含まない」に更新します。空欄や「いいえ」の場合、書かれていない品目は今の状態のまま残します。'}));
  body.appendChild(el('div',{class:'row noprint', style:{margin:'12px 0'}},[
    el('button',{class:'btn', onclick:()=>exportCsv('nutri')},['今の栄養成分一覧をCSVで出す（編集用のひな形）'])
  ]));
  const fi = el('input',{type:'file', accept:'.csv,text/csv'});
  body.appendChild(fi);
  const preview = el('div');
  body.appendChild(preview);
  const foot = el('div',{class:'modal-foot'},[el('button',{class:'btn', onclick:closeModal},['閉じる'])]);
  body.appendChild(foot);
  fi.addEventListener('change', ()=>{
    const f = fi.files[0]; if(!f) return;
    const fr = new FileReader();
    fr.onload = ()=>{
      let rows;
      try{ rows = parseCsv(String(fr.result)); }
      catch(e){ clear(preview).appendChild(msg('err','CSVを読み込めませんでした。ファイル形式を確認してください。')); return; }
      if(rows.length<2){ clear(preview).appendChild(msg('err','データ行が見つかりません。1行目は見出し、2行目以降にデータを入れてください。')); return; }
      const plan=[], ng=[];
      rows.slice(1).forEach((r,idx)=>{
        const line = idx+2;
        const name = (r[1]||'').trim();
        const code = (r[0]||'').trim();
        if(!name && !code){ return; }
        const ing = DATA.ingredients.find(x=>x.name===name) || DATA.ingredients.find(x=>x.code===code);
        if(!ing){ ng.push({line:line, name:name||code, why:'この名前の食材が登録されていません'}); return; }
        const changes=[]; const errs=[];
        const basisLabel = (r[2]||'').trim();
        let basis = null;
        if(basisLabel){
          basis = BASIS_BY_LABEL[basisLabel];
          if(!basis) errs.push('基準「'+basisLabel+'」は使用できません（100g当たり / 100ml当たり / 1個当たり / 1食当たり）');
          else if(basis!==ing.nutri.basis) changes.push('基準→'+NUTRI_BASIS[basis]);
        }
        const vals={};
        NUTRIENTS.forEach((x,i)=>{
          const raw = (r[3+i]||'').trim();
          if(raw===''){ return; }
          const v = num(raw);
          if(v===null){ errs.push(x.name+'「'+raw+'」が数値ではありません'); return; }
          if(v<0){ errs.push(x.name+'にマイナスは入力できません'); return; }
          vals[x.k]=v;
          if(num(ing.nutri[x.k])!==v) changes.push(x.name+'→'+v);
        });
        const source = (r[3+NUTRIENTS.length]||'').trim();
        const est = (r[4+NUTRIENTS.length]||'').trim();
        const alRaw = (r[5+NUTRIENTS.length]||'').trim();
        const confirmed = (r[6+NUTRIENTS.length]||'').trim()==='はい';
        let alIn = [];
        if(alRaw){
          alIn = alRaw.split(/[・,、\/]/).map(s=>s.trim()).filter(s=>s);
          alIn.forEach(a=>{ if(ALLERGEN_ALL.indexOf(a)<0) errs.push('アレルゲン「'+a+'」は表示対象品目に含まれません'); });
        }
        if(alIn.length) changes.push('含むアレルゲン→'+alIn.join('・'));
        if(confirmed) changes.push('未確認の品目を「含まない」に更新');
        if(errs.length){ ng.push({line:line, name:name, why:errs.join(' / ')}); return; }
        if(!changes.length){ return; }
        plan.push({ing:ing, basis:basis, vals:vals, source:source, est:est, alIn:alIn, confirmed:confirmed, changes:changes, line:line});
      });
      clear(preview);
      preview.appendChild(el('h4',{text:'更新内容の確認'}));
      preview.appendChild(el('div',{class:'grid g4'},[
        statCard('読み込んだ行', rows.length-1, '行'),
        statCard('更新する食材', plan.length, '件'),
        statCard('変更なし', (rows.length-1)-plan.length-ng.length, '件'),
        statCard('エラーのある行', ng.length, '行')
      ]));
      if(ng.length){
        const t=el('table',{class:'dt'});
        t.appendChild(el('thead',{},[el('tr',{},[el('th',{text:'行番号'}),el('th',{text:'食材名'}),el('th',{text:'エラー理由'})])]));
        const tb=el('tbody');
        ng.slice(0,60).forEach(x=>tb.appendChild(el('tr',{},[el('td',{text:x.line}),el('td',{text:x.name||'（空欄）'}),el('td',{text:x.why})])));
        t.appendChild(tb);
        preview.appendChild(msg('err','次の行は取り込めません。'));
        preview.appendChild(el('div',{class:'tablewrap'},[t]));
      }
      if(plan.length){
        const t=el('table',{class:'dt'});
        t.appendChild(el('thead',{},[el('tr',{},[el('th',{text:'食材名'}),el('th',{text:'更新される内容'})])]));
        const tb=el('tbody');
        plan.slice(0,80).forEach(x=>tb.appendChild(el('tr',{},[el('td',{text:x.ing.name}),el('td',{class:'hint',text:x.changes.join('、')})])));
        t.appendChild(tb);
        preview.appendChild(el('div',{class:'tablewrap'},[t]));
      }else if(!ng.length){
        preview.appendChild(msg('info','更新が必要な内容はありませんでした。'));
      }
      clear(foot);
      foot.appendChild(el('button',{class:'btn', onclick:closeModal},['キャンセル']));
      if(plan.length) foot.appendChild(el('button',{class:'btn primary', onclick:()=>{
        plan.forEach(x=>{
          const ing = x.ing;
          if(x.basis) ing.nutri.basis = x.basis;
          Object.keys(x.vals).forEach(k=>{ ing.nutri[k] = x.vals[k]; });
          if(x.source) ing.nutri.source = x.source;
          if(x.est) ing.nutri.estimate = (x.est==='実測値'?'measured':'estimate');
          ing.allergens = ing.allergens || {};
          if(x.confirmed) ALLERGEN_ALL.forEach(a=>{ if(x.alIn.indexOf(a)<0) ing.allergens[a]='out'; });
          x.alIn.forEach(a=>{ ing.allergens[a]='in'; });
        });
        markDirty(); closeModal(); render();
        toast(plan.length+'件の食材の栄養成分・アレルゲンを更新しました。');
      }},[plan.length+'件を更新する']));
    };
    fr.readAsText(f,'UTF-8');
  });
  openModal(body, true);
}

/* ===== 蔦屋メニューコスト表から取り込んだ初期データ =====
   出典：既存スプレッドシート「蔦屋メニューコスト」
   栄養成分とアレルゲンは元表に記載がないため未入力のまま登録しています。
   金額の食い違いや使用量の空欄は、各データの備考に【要確認】として残しています。 */
const SEED_INGS = [];
const SEED_PACKS = [];
const SEED_PREPS = [];
const SEED_MENUS = [];

// 蔦屋メニューコスト表のデータを登録する
function loadTsutaya(){
  const ingMap = {}, packMap = {}, prepMap = {};
  SEED_INGS.forEach(a=>{
    const exist = DATA.ingredients.find(x=>x.name===a[0]);
    if(exist){ ingMap[a[0]] = exist.id; return; }   // 既にあるものは作り直さない
    const i = newIngredient();
    i.code = nextCode('ing','I');
    i.name=a[0]; i.dispName=a[1]; i.category=a[2]; i.maker=a[3]; i.supplier=a[4];
    i.price=a[5]; i.qty=a[6]; i.unit=a[7]; i.yieldRate=a[8]; i.pieceWeight=a[9]; i.note=a[10];
    // アレルゲンは元表に記載がないため、すべて「未確認」のまま登録する
    ALLERGEN_ALL.forEach(x=>i.allergens[x]='unknown');
    DATA.ingredients.push(i); ingMap[a[0]] = i.id;
  });
  SEED_PACKS.forEach(a=>{
    const exist = DATA.packages.find(x=>x.name===a[0]);
    if(exist){ packMap[a[0]] = exist.id; return; }
    const p = newPackage();
    p.code = nextCode('pack','P');
    p.name=a[0]; p.category=a[1]; p.price=a[2]; p.qty=a[3]; p.unit=a[4]; p.note=a[5];
    DATA.packages.push(p); packMap[a[0]] = p.id;
  });
  SEED_PREPS.forEach(a=>{
    const exist = DATA.preps.find(x=>x.name===a[0]);
    if(exist){ prepMap[a[0]] = exist.id; return; }
    const p = newPrep();
    p.code = nextCode('prep','R');
    p.name=a[0]; p.category=a[1];
    p.items = a[2].map(m=>({refType:'ing', refId:ingMap[m[0]], qty:m[1], unit:m[2]}));
    p.rawWeight=a[3]; p.finishedWeight=a[4]; p.batchCount=1; p.note=a[5];
    DATA.preps.push(p); prepMap[a[0]] = p.id;
  });
  SEED_MENUS.forEach(a=>{
    if(DATA.menus.some(x=>x.name===a[0])) return;
    const m = newMenu();
    m.code = nextCode('menu','M');
    m.name=a[0]; m.category=a[1]; m.price=a[2]; m.servingSize=a[3];
    m.servings = 1; m.taxType='incl'; m.author='蔦屋データ取込'; m.note=a[7];
    m.items = a[4].map(it=>({refType:it[0], refId:(it[0]==='ing'?ingMap[it[1]]:prepMap[it[1]]), qty:it[2], unit:it[3]}));
    m.packs = a[5].map(pk=>({packId:packMap[pk[0]], qty:pk[1]}));
    m.candidates = a[6].map(v=>({id:uid('cd'), price:v}));
    DATA.menus.push(m);
  });
}
function removeTsutaya(){
  const menuNames = SEED_MENUS.map(a=>a[0]);
  const prepNames = SEED_PREPS.map(a=>a[0]);
  const packNames = SEED_PACKS.map(a=>a[0]);
  const ingNames  = SEED_INGS.map(a=>a[0]);
  DATA.menus = DATA.menus.filter(x=>menuNames.indexOf(x.name)<0);
  DATA.preps = DATA.preps.filter(x=>prepNames.indexOf(x.name)<0);
  DATA.packages = DATA.packages.filter(x=>packNames.indexOf(x.name)<0);
  DATA.ingredients = DATA.ingredients.filter(x=>ingNames.indexOf(x.name)<0);
  markDirty(); render(); toast('蔦屋データを削除しました。');
}

/* ===== SCI 原価データ（3つのスプレッドシート＋Drive主要ファイルから取り込み） =====
   出典：原材料マスタ／冷凍ピザシート・折りピザ・パスタソース／ORIGINALジェラート原価計算 商品表示／
        母の日ギフトセット2026／Xmasギフトセット2025／冷凍パスタ／トリッパ／パイ／Dolce／かき氷 ほか
   同じ名前の食材は既存データと統合し、単価が食い違うものは別名で両方登録しています。 */
const SCI_INGS = [];
const SCI_PACKS = [];
const SCI_PREPS = [];
const SCI_MENUS = [];

// SCI原価データを登録する。同名の食材・包材が既にあれば、それを使い回して重複を作らない。
function loadSCI(){
  const ingMap = {}, packMap = {}, prepMap = {};
  // --- 食材 ---
  SCI_INGS.forEach(a=>{
    const exist = DATA.ingredients.find(x=>x.name===a[0]);
    if(exist){
      // 既存と統合する。購入価格は既存を優先し、空いている項目だけを埋める
      ingMap[a[0]] = exist.id;
      exist.nutri = exist.nutri || {};
      const nu = a[11];
      const empty = NUTRIENTS.every(x=>exist.nutri[x.k]===null||exist.nutri[x.k]===undefined);
      if(nu && empty){
        exist.nutri.basis = '100g';
        exist.nutri.kcal=nu[0]; exist.nutri.protein=nu[1]; exist.nutri.fat=nu[2]; exist.nutri.carb=nu[3]; exist.nutri.salt=nu[4];
        exist.nutri.source = '元表の栄養計算シートより'; exist.nutri.estimate = 'estimate';
      }
      if(!exist.dispName) exist.dispName = a[1];
      if(!exist.category) exist.category = a[2];
      if(!exist.maker) exist.maker = a[3];
      if(!exist.supplier) exist.supplier = a[4];
      if(exist.pieceWeight===null||exist.pieceWeight===undefined) exist.pieceWeight = a[9];
      if(a[10] && String(exist.note||'').indexOf(a[10])<0) exist.note = (exist.note? exist.note+'\n':'') + a[10];
      return;
    }
    const i = newIngredient();
    i.code = nextCode('ing','I');
    i.name=a[0]; i.dispName=a[1]; i.category=a[2]; i.maker=a[3]; i.supplier=a[4];
    i.price=a[5]; i.qty=a[6]; i.unit=a[7]; i.yieldRate=a[8]; i.pieceWeight=a[9]; i.note=a[10];
    const nu = a[11];
    if(nu){
      i.nutri.basis = '100g';
      i.nutri.kcal=nu[0]; i.nutri.protein=nu[1]; i.nutri.fat=nu[2]; i.nutri.carb=nu[3]; i.nutri.salt=nu[4];
      i.nutri.source = '元表の栄養計算シートより'; i.nutri.estimate = 'estimate';
    }
    // アレルゲンは元表に食材単位の記載がないため、すべて「未確認」で登録する
    ALLERGEN_ALL.forEach(x=>i.allergens[x]='unknown');
    DATA.ingredients.push(i); ingMap[a[0]] = i.id;
  });
  // --- 包材 ---
  SCI_PACKS.forEach(a=>{
    const exist = DATA.packages.find(x=>x.name===a[0]);
    if(exist){ packMap[a[0]] = exist.id; return; }
    const p = newPackage();
    p.code = nextCode('pack','P');
    p.name=a[0]; p.category=a[1]; p.price=a[2]; p.qty=a[3]; p.unit=a[4]; p.note=a[5];
    DATA.packages.push(p); packMap[a[0]] = p.id;
  });
  // --- 仕込み品：先に器だけ作ってから材料を入れる（仕込み品どうしの参照順に依存しないため） ---
  const created = [];
  SCI_PREPS.forEach(a=>{
    const exist = DATA.preps.find(x=>x.name===a[0]);
    if(exist){ prepMap[a[0]] = exist.id; created.push(null); return; }
    const p = newPrep();
    p.code = nextCode('prep','R');
    p.name=a[0]; p.category=a[1]; p.rawWeight=a[3]; p.finishedWeight=a[4]; p.batchCount=1; p.note=a[5];
    DATA.preps.push(p); prepMap[a[0]] = p.id; created.push(p);
  });
  const resolve = nm => prepMap[nm] ? {refType:'prep', refId:prepMap[nm]}
                     : (ingMap[nm] ? {refType:'ing', refId:ingMap[nm]} : null);
  SCI_PREPS.forEach((a,idx)=>{
    const p = created[idx]; if(!p) return;
    p.items = a[2].map(m=>{
      const r = resolve(m[0]); if(!r) return null;
      return {refType:r.refType, refId:r.refId, qty:m[1], unit:m[2]};
    }).filter(Boolean);
  });
  // --- メニュー ---
  SCI_MENUS.forEach(a=>{
    if(DATA.menus.some(x=>x.name===a[0])) return;
    const m = newMenu();
    m.code = nextCode('menu','M');
    m.name=a[0]; m.category=a[1]; m.price=a[2]; m.servingSize=a[4];
    m.servings = 1; m.taxType='excl'; m.author='SCI原価データ取込'; m.note=a[7];
    m.items = a[5].map(it=>{
      const r = resolve(it[0]); if(!r) return null;
      return {refType:r.refType, refId:r.refId, qty:it[1], unit:it[2]};
    }).filter(Boolean);
    m.packs = a[6].map(pk=> packMap[pk[0]] ? {packId:packMap[pk[0]], qty:pk[1]} : null).filter(Boolean);
    // 卸価格が入っているものは候補価格として登録しておく
    const cands = [];
    if(a[3]) cands.push({id:uid('cd'), price:a[3]});
    if(a[2]) cands.push({id:uid('cd'), price:a[2]});
    m.candidates = cands;
    DATA.menus.push(m);
  });
}
function removeSCI(){
  const mn = SCI_MENUS.map(a=>a[0]), pn = SCI_PREPS.map(a=>a[0]),
        kn = SCI_PACKS.map(a=>a[0]), inms = SCI_INGS.map(a=>a[0]);
  DATA.menus = DATA.menus.filter(x=>mn.indexOf(x.name)<0);
  DATA.preps = DATA.preps.filter(x=>pn.indexOf(x.name)<0);
  DATA.packages = DATA.packages.filter(x=>kn.indexOf(x.name)<0);
  DATA.ingredients = DATA.ingredients.filter(x=>inms.indexOf(x.name)<0);
  markDirty(); render(); toast('SCI原価データを削除しました。');
}
function hasSCIData(){ return DATA.menus.some(m=>SCI_MENUS.some(a=>a[0]===m.name)); }


/* ===== 商品規格書・原材料表示ラベルから読み取った栄養成分とアレルゲン =====
   出典：Driveの規格書フォルダ（PDF約36件・ラベル画像約45件）
   値は規格書／ラベルの記載そのままです。読み取れなかった項目は未入力のままにしています。 */
const SPEC_SHEETS = [];

// 規格書の内容を既存の食材へ反映する（原価や配合は一切変えず、栄養成分とアレルゲンだけを上書きする）
function applySpecSheets(){
  let n = 0;
  SPEC_SHEETS.forEach(a=>{
    const ing = DATA.ingredients.find(x=>x.name===a[0]);
    if(!ing) return;
    ing.nutri = ing.nutri || {};
    // 利用者が自分で入力した栄養成分は上書きしない（規格書由来か元表由来のものだけ更新する）
    const src = String(ing.nutri.source||'');
    if(src && src.indexOf('【規格書】')<0 && src.indexOf('元表')<0) return;
    ing.nutri.basis = (a.length>12 && a[12]) ? a[12] : '100g';
    const map = {kcal:a[1], protein:a[2], fat:a[3], carb:a[4], salt:a[5], sugar:a[6], fiber:a[7]};
    Object.keys(map).forEach(k=>{ if(map[k]!==null && map[k]!==undefined) ing.nutri[k] = map[k]; });
    ing.nutri.source = '【規格書】' + a[10];
    ing.nutri.estimate = 'measured';
    ing.nutri.note = a[11];
    ing.allergens = ing.allergens || {};
    const ins = a[8], confirmed = a[9];
    if(confirmed) ALLERGEN_ALL.forEach(x=>{ if(ins.indexOf(x)<0) ing.allergens[x]='out'; });
    ins.forEach(x=>{ ing.allergens[x]='in'; });
    // 規格書の内容を備考にも残す
    const tag = '【規格書】'+a[10]+(a[11]?'／'+a[11]:'');
    if(String(ing.note||'').indexOf('【規格書】')<0) ing.note = (ing.note? ing.note+'\n':'') + tag;
    n++;
  });
  return n;
}
// 名前が違うだけで中身が同じ食材の対応表（左から右へ、栄養成分とアレルゲンを写す）
const NUTRI_ALIAS = [];
// 片方にだけ入っている栄養成分・アレルゲンを、もう片方の空いている側へ写す
function syncNutriAliases(){
  let n = 0;
  NUTRI_ALIAS.forEach(pair=>{
    const from = DATA.ingredients.find(x=>x.name===pair[0]);
    const to   = DATA.ingredients.find(x=>x.name===pair[1]);
    if(!from || !to) return;
    to.nutri = to.nutri || {}; from.nutri = from.nutri || {};
    const fromHas = NUTRIENTS.some(x=>from.nutri[x.k]!==null && from.nutri[x.k]!==undefined);
    const toEmpty = NUTRIENTS.every(x=>to.nutri[x.k]===null || to.nutri[x.k]===undefined);
    const toSrc = String(to.nutri.source||'');
    // 利用者が自分で入力したものは触らない
    if(toSrc && toSrc.indexOf('【規格書】')<0 && toSrc.indexOf('元表')<0) return;
    if(fromHas && toEmpty){
      to.nutri.basis = from.nutri.basis || '100g';
      NUTRIENTS.forEach(x=>{ to.nutri[x.k] = from.nutri[x.k]; });
      to.nutri.source = from.nutri.source;
      to.nutri.estimate = from.nutri.estimate;
      to.nutri.note = from.nutri.note;
      if(String(to.note||'').indexOf('【同一商品】')<0)
        to.note = (to.note? to.note+'\n':'') + '【同一商品】「'+pair[0]+'」と同じ商品として、栄養成分とアレルゲンを共有しています。購入単価は別々に登録されています【要確認】';
      n++;
    }
    // アレルゲンも、片方が確定していてもう片方が未確認なら写す
    const fromDone = ALLERGEN_ALL.every(a=>from.allergens && from.allergens[a] && from.allergens[a]!=='unknown');
    const toUnknown = ALLERGEN_ALL.some(a=>!to.allergens || !to.allergens[a] || to.allergens[a]==='unknown');
    if(fromDone && toUnknown){
      to.allergens = to.allergens || {};
      ALLERGEN_ALL.forEach(a=>{ to.allergens[a] = from.allergens[a]; });
    }
  });
  return n;
}
function hasSpecData(){
  return DATA.ingredients.some(i=>i.nutri && String(i.nutri.source||'').indexOf('【規格書】')>=0);
}

/* ===== 栄養成分が未入力の食材に入れる推定値 =====
   出典は日本食品標準成分表2020年版（八訂）を基本とし、収載のないものはUSDAまたは商品の一般的な表示値から推定しています。
   すべて「推定値」として登録し、備考に代用した食品名を残します。実測値・規格書の値は上書きしません。 */
const EST_NUTRI = [];

// 未入力の栄養成分に推定値を入れる。既に値が入っている項目には触れない。
function applyEstimates(){
  let filled = 0;
  EST_NUTRI.forEach(a=>{
    const ing = DATA.ingredients.find(x=>x.name===a[0]);
    if(!ing) return;
    ing.nutri = ing.nutri || {};
    const src = String(ing.nutri.source||'');
    // 利用者が自分で入力したものには触れない
    if(src && src.indexOf('【規格書】')<0 && src.indexOf('元表')<0 && src.indexOf('【推定値】')<0) return;
    const vals = {kcal:a[2], protein:a[3], fat:a[4], carb:a[5], salt:a[6]};
    const done = [];
    // 基準が未設定、または個数単位で100g基準が使えない場合はここで合わせる
    if(!ing.nutri.basis || a[1]!=='100g') ing.nutri.basis = a[1];
    NUTRIENTS.forEach(x=>{
      const v = vals[x.k];
      if(v===null || v===undefined) return;
      if(ing.nutri[x.k]===null || ing.nutri[x.k]===undefined){ ing.nutri[x.k] = v; done.push(x.name); }
    });
    if(done.length){
      filled++;
      ing.nutri.estimate = 'estimate';
      ing.nutri.source = (src && src.indexOf('【規格書】')===0)
        ? src + '／一部【推定値】' + a[7]
        : '【推定値】' + a[7];
      ing.nutri.note = '【推定値】' + done.join('・') + ' … ' + a[7] + '【要確認】実測値ではありません';
      if(String(ing.note||'').indexOf('【推定値】')<0)
        ing.note = (ing.note? ing.note+'\n':'') + '【推定値】栄養成分は ' + a[7] + ' から入れています。実際の商品の表示値に置き換えてください【要確認】';
    }
    // アレルゲンは、その食材そのものが該当する品目だけを「含む」にする（含まないの判定はしない）
    (a[8]||[]).forEach(al=>{
      ing.allergens = ing.allergens || {};
      if(ing.allergens[al]!=='in' && ing.allergens[al]!=='out') ing.allergens[al] = 'in';
    });
  });
  return filled;
}
function hasEstimates(){
  return DATA.ingredients.some(i=>i.nutri && String(i.nutri.source||'').indexOf('【推定値】')>=0);
}

/* ============================================================
   17. 起動処理
   ============================================================ */
async function boot(){
  const mode = await Store.init();
  $('#storeBadge').textContent = '保存先：' + mode;
  if(mode==='保存不可') $('#storeBadge').className = 'badge err';
  $('#buildTag').textContent = '飲食店向け　' + APP_BUILD;
  const saved = await Store.load();
  DATA = saved ? migrate(saved) : emptyData();
  // GitHub同期が設定されていれば、起動時にまず最新を取り込む
  ghLoadCfg(); ghSetState(ghReady()?'ok':'off');
  if(ghReady()){
    const baseline=await Store.loadSync();
    if(baseline && baseline.target===ghTarget() && baseline.sha && baseline.base){
      GH.sha=baseline.sha; GH.base=baseline.base;
    }
    try{ await ghPull({quiet:true, silent:true}); }catch(e){ ghSetState('error','起動時の取り込みに失敗しました。'); }
  }
  buildNav();
  render();
  setSaveState('saved');
  // 他の端末の変更を拾う：画面に戻ってきたときに最新を確認する
  let ghPullTimer = null;
  const refresh = ()=>{
    if(!ghReady() || document.hidden || GH.busy) return;
    if(ghPullTimer) clearTimeout(ghPullTimer);
    ghPullTimer = setTimeout(()=>{ ghPull({silent:true}).catch(()=>{}); }, 400);
  };
  document.addEventListener('visibilitychange', refresh);
  window.addEventListener('focus', refresh);
  // 送信前にページを閉じようとしたら知らせる
  window.addEventListener('beforeunload', (e)=>{
    if(ghReady() && (GH.state==='conflict' || (GH.base && JSON.stringify(stripVolatile(DATA))!==JSON.stringify(stripVolatile(GH.base))))){
      e.preventDefault(); e.returnValue = '';
    }
  });
}
// 蔦屋メニューコスト表のデータが入っているか
function hasSeedData(){
  return DATA.menus.some(m=>SEED_MENUS.some(a=>a[0]===m.name));
}
window.addEventListener('error', function(ev){
  // 想定外の不具合でも、プログラム用語をそのまま画面へ出さない
  console.error(ev.error||ev.message);
});
boot();
